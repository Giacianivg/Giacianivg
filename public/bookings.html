<div id="toast-container"></div>
<script src="design-system/u.js"></script>
<script>
function resTable(list, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!list.length) { DS.emptyState(el, 'Nenhuma reserva', 'Sem reservas nesta categoria.', ''); return; }
  el.innerHTML = `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Hóspede</th><th>Acomodação</th><th>Entrada</th><th>Saída</th><th>Total</th><th>Status</th></tr></thead>
    <tbody>${list.map(r => `<tr>
      <td>${DS.esc(r.guest_name || r.guestName || '—')}</td>
      <td>${DS.esc(DS.room(r.room_type || r.roomType || r.accommodation))}</td>
      <td class="td-mono">${DS.date(r.check_in || r.checkIn)}</td>
      <td class="td-mono">${DS.date(r.check_out || r.checkOut)}</td>
      <td class="t-serif" style="font-family:var(--f-serif);color:var(--gold)">${DS.cur(r.total_amount || r.totalAmount || r.total)}</td>
      <td>${DS.statusBadge(r.status)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

(async () => {
  const session = await DS.requireAuth();
  if (!session) return;
  DS.initNav();
  DS.initTabs('tabs-root');
  const avEl = document.getElementById('user-avatar');
  if (avEl) avEl.textContent = (session.user.email || '').slice(0,2).toUpperCase();

  try {
    const res = await DS.api('/api/reservations');
    const all  = res?.reservations || res?.data || (Array.isArray(res) ? res : []);

    const confirmed = all.filter(r => r.status === 'confirmed');
    const pending   = all.filter(r => r.status === 'pending');
    const cancelled = all.filter(r => r.status === 'cancelled');
    const revenue   = confirmed.reduce((s,r) => s + parseFloat(r.total_amount || r.total || 0), 0);

    document.getElementById('summary-cards').innerHTML = `
      <div class="metric-card"><div class="metric-label">Total</div><div class="metric-value">${all.length}</div></div>
      <div class="metric-card"><div class="metric-label">Confirmadas</div><div class="metric-value t-ok">${confirmed.length}</div></div>
      <div class="metric-card"><div class="metric-label">Pendentes</div><div class="metric-value t-warn">${pending.length}</div></div>
      <div class="metric-card"><div class="metric-label">Receita</div><div class="metric-value t-serif" style="font-size:1.5rem;font-family:var(--f-serif);color:var(--gold)">${DS.cur(revenue)}</div></div>`;

    resTable(all, 'tbl-all');
    resTable(confirmed, 'tbl-confirmed');
    resTable(pending, 'tbl-pending');
    resTable(cancelled, 'tbl-cancelled');
  } catch (err) {
    DS.errorState('tbl-all', err.message);
  }
})();
</script>
