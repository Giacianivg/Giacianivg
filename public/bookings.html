  <link rel="stylesheet" href="design-system/t.css">

  <style>
    /* Cor da grade da timeline — os tokens --bdr0/--bdr1 não existem no tema
       (t.css só define --bdr/--bdr2), então a grade usa uma var própria com
       valor garantido, igual ao calendar.html. */
    :root { --calbd: #334155; }
    [data-theme="clean"] { --calbd: #cbd5e1; }

    html, body { height: 100%; margin: 0; padding: 0; }
    .app-shell { height: 100vh; }
    .main-content { height: 100vh; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .page-body { flex: 1; display: flex; flex-direction: column; padding: var(--sp-3) !important; overflow: hidden; min-height: 0; gap: var(--sp-3); }

    /* ── KPI bar ── */
    .kpi-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: var(--sp-3); flex-shrink: 0; }
    .kpi-card { background: var(--sur1); border: 1px solid var(--bdr1); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: 2px; }
    .kpi-label { font-size: .72rem; color: var(--tx3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .kpi-value { font-size: 1.6rem; font-weight: 800; color: var(--tx1); line-height: 1.1; }
    .kpi-value.t-ok { color: #22c55e; }
    .kpi-value.t-royal { color: var(--royal-l); }
    .kpi-value.t-gold { color: var(--gold); font-family: var(--f-serif); }
    .kpi-sub { font-size: .72rem; color: var(--tx3); }

    /* ── Toolbar ── */
    .toolbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; flex-shrink: 0; }
    .toolbar-filters { display: flex; gap: var(--sp-2); flex: 1; flex-wrap: wrap; }
    .toolbar select, .toolbar input { height: 34px; padding: 0 var(--sp-2); font-size: .8rem; background: var(--sur1); border: 1px solid var(--bdr1); border-radius: var(--r-sm); color: var(--tx1); }
    .toolbar input[type=text] { min-width: 180px; }
    .toolbar input[type=date] { min-width: 120px; }
    .view-toggle { display: flex; gap: 2px; background: var(--sur2); border: 1px solid var(--bdr1); border-radius: var(--r-sm); padding: 2px; }
    .view-btn { padding: 4px 14px; border-radius: 4px; font-size: .78rem; font-weight: 600; cursor: pointer; background: none; border: none; color: var(--tx3); transition: all .15s; white-space: nowrap; }
    .view-btn.active { background: var(--royal-bg); color: var(--royal-l); }
    .month-nav { display: flex; align-items: center; gap: var(--sp-2); }
    .nav-arrow { padding: 5px 10px; font-size: .875rem; background: none; border: 1px solid var(--bdr1); border-radius: var(--r-sm); color: var(--tx2); cursor: pointer; transition: all .15s; }
    .nav-arrow:hover { background: var(--sur2); }
    #period-label { font-weight: 700; font-size: .9rem; color: var(--tx1); min-width: 150px; text-align: center; }

    /* ── Content area ── */
    .content-area { flex: 1; min-height: 0; overflow: hidden; border: 1px solid var(--bdr1); border-radius: var(--r-md); background: var(--sur1); }
    .scroll-area { height: 100%; overflow: auto; }

    /* ══ GANTT TIMELINE ══ */
    .gantt-grid {
      display: grid;
      grid-template-columns: 96px repeat(var(--days, 31), minmax(28px, 1fr));
      gap: 0;
      font-size: .72rem;
      min-width: 700px;
    }
    .gh-corner { background: var(--sur2); border-right: 1px solid var(--calbd); border-bottom: 1px solid var(--calbd); padding: 5px 8px; position: sticky; top: 0; left: 0; z-index: 5; }
    .gh-day { background: var(--sur2); border-right: 1px solid var(--calbd); border-bottom: 1px solid var(--calbd); text-align: center; padding: 4px 2px; position: sticky; top: 0; z-index: 3; cursor: default; }
    .gh-day .day-num { font-weight: 700; color: var(--tx2); font-size: .73rem; }
    .gh-day .day-name { font-size: .58rem; color: var(--tx3); }
    .gh-day.is-today { background: rgba(184,134,0,.12); }
    .gh-day.is-today .day-num { color: var(--gold); }
    .gh-day.is-weekend .day-num { color: var(--royal-l); }
    .gantt-section { grid-column: 1 / -1; background: var(--sur2); padding: 3px 10px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--tx3); border-top: 1px solid var(--calbd); border-bottom: 1px solid var(--calbd); position: sticky; left: 0; }
    .gantt-room-label { background: var(--sur1); border-right: 1px solid var(--calbd); border-bottom: 1px solid var(--calbd); padding: 0 8px; display: flex; align-items: center; font-size: .74rem; font-weight: 600; color: var(--tx2); white-space: nowrap; position: sticky; left: 0; z-index: 2; min-height: 44px; }
    .gantt-canvas { grid-column: 2 / -1; position: relative; border-bottom: 1px solid var(--calbd); cursor: crosshair; overflow: visible; min-height: 44px; }
    .gantt-canvas::before { content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(to right, transparent, transparent calc(100% / var(--days, 31) - 1px), var(--calbd) calc(100% / var(--days, 31) - 1px), var(--calbd) calc(100% / var(--days, 31))); pointer-events:none; z-index:0; }
    /* Overlay de seleção por arraste (multi-período) */
    .drag-sel { position: absolute; top: 3px; bottom: 3px; background: rgba(99,102,241,.25); border: 1.5px solid #6366f1; border-radius: 3px; pointer-events: none; z-index: 3; }
    /* Menu de ações em lote após seleção */
    .batch-menu { position: fixed; z-index: 320; background: var(--sur1); border: 1px solid var(--calbd); border-radius: var(--r-md); padding: var(--sp-3); width: 232px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    .batch-menu-title { font-size: .72rem; color: var(--tx3); margin-bottom: var(--sp-1); }
    .batch-menu-range { font-size: .84rem; font-weight: 700; color: var(--tx1); margin-bottom: var(--sp-3); }
    .batch-menu-btn { width: 100%; text-align: left; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--bdr1); background: var(--sur2); color: var(--tx1); font-size: .8rem; font-weight: 600; cursor: pointer; transition: all .12s; display: flex; align-items: center; gap: 8px; }
    .batch-menu-btn:hover { background: var(--royal-bg); color: var(--royal-l); border-color: rgba(99,102,241,.35); }
    .batch-menu-hint { font-size: .68rem; color: var(--tx3); margin-top: var(--sp-2); line-height: 1.4; }
    .today-stripe { position:absolute; top:0; bottom:0; background: rgba(234,179,8,.08); pointer-events:none; z-index:1; }
    .resv-bar {
      position: absolute; top: 5px; bottom: 5px;
      border-radius: 4px; padding: 0 6px;
      display: flex; align-items: center;
      font-size: .65rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; z-index: 2;
      transition: filter .12s, transform .12s;
      min-width: 4px;
    }
    .resv-bar:hover { filter: brightness(1.2); transform: scaleY(1.06); }

    /* Manutenção/bloqueio do quarto no dia: faixa âmbar hachurada com 🔧 (manutenção)
       ou 🔒 (bloqueio genérico). Lida da fonte única (availability blocked, via
       /api/occupancy/calendar). pointer-events:none preserva o arraste de criar reserva. */
    .maint-block {
      position: absolute; top: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .62rem; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(45deg, rgba(234,179,8,.16), rgba(234,179,8,.16) 5px, rgba(234,179,8,.30) 5px, rgba(234,179,8,.30) 10px);
    }

    /* Status colors */
    .status-pending    { background: rgba(234,179,8,.22); color: #ca8a04; border: 1px solid rgba(234,179,8,.35); }
    .status-confirmed  { background: rgba(34,197,94,.2);  color: #16a34a; border: 1px solid rgba(34,197,94,.35); }
    .status-checkedin  { background: rgba(99,102,241,.22); color: var(--royal-l); border: 1px solid rgba(99,102,241,.35); }
    .status-checkedout { background: rgba(100,116,139,.18); color: var(--tx3); border: 1px solid var(--bdr1); }
    .status-cancelled  { background: rgba(239,68,68,.15); color: #dc2626; border: 1px solid rgba(239,68,68,.3); text-decoration: line-through; }

    /* ══ TABLE LIST ══ */
    .tbl-actions { display: flex; gap: 4px; }
    .act-btn { padding: 3px 8px; font-size: .7rem; border-radius: 4px; cursor: pointer; border: 1px solid var(--bdr1); background: var(--sur2); color: var(--tx2); font-weight: 600; transition: all .12s; white-space: nowrap; }
    .act-btn:hover { background: var(--sur1); color: var(--tx1); }
    .act-btn.act-confirm { border-color: rgba(34,197,94,.4); color: #16a34a; }
    .act-btn.act-confirm:hover { background: rgba(34,197,94,.1); }
    .act-btn.act-checkin  { border-color: rgba(99,102,241,.4); color: var(--royal-l); }
    .act-btn.act-checkin:hover { background: rgba(99,102,241,.1); }
    .act-btn.act-checkout { border-color: var(--bdr1); color: var(--tx3); }
    .act-btn.act-cancel   { border-color: rgba(239,68,68,.4); color: #dc2626; }
    .act-btn.act-cancel:hover { background: rgba(239,68,68,.1); }
    .act-btn.act-detail   { border-color: var(--bdr1); color: var(--gold); }
    .act-btn.act-edit     { border-color: rgba(99,102,241,.4); color: var(--royal-l); }
    .act-btn.act-edit:hover { background: rgba(99,102,241,.1); }
    .deposit-bar { display: flex; align-items: center; gap: 5px; }
    .deposit-track { flex: 1; min-width: 50px; max-width: 80px; height: 5px; border-radius: 3px; background: var(--bdr1); overflow: hidden; }
    .deposit-fill { height: 100%; border-radius: 3px; background: var(--gold); }
    .channel-badge { font-size: .65rem; padding: 2px 6px; border-radius: 10px; background: var(--sur2); border: 1px solid var(--bdr1); color: var(--tx2); white-space: nowrap; }

    /* ══ DRAWER ══ */
    /* Fundo OPACO var(--bg1) — mesma variável do popup de pagamento (.cg-modal).
       Antes era var(--sur1), translúcido (rgba .06), deixando o conteúdo de trás vazar. */
    .drawer { position: fixed; top: 0; right: -420px; width: 400px; height: 100vh; background: var(--bg1); border-left: 1px solid var(--bdr1); z-index: 200; display: flex; flex-direction: column; transition: right .25s cubic-bezier(.4,0,.2,1); overflow: hidden; }
    .drawer.open { right: 0; }
    .drawer-header { padding: var(--sp-4); border-bottom: 1px solid var(--bdr1); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-2); flex-shrink: 0; }
    .drawer-title { font-size: 1rem; font-weight: 700; color: var(--tx1); }
    .drawer-sub { font-size: .78rem; color: var(--tx3); margin-top: 2px; }
    .drawer-close { background: none; border: none; color: var(--tx3); cursor: pointer; font-size: 1.2rem; padding: 2px 6px; border-radius: var(--r-sm); }
    .drawer-close:hover { background: var(--sur2); }
    .drawer-body { flex: 1; overflow-y: auto; padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
    .drawer-section { display: flex; flex-direction: column; gap: var(--sp-2); }
    .drawer-section-title { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--tx3); padding-bottom: var(--sp-1); border-bottom: 1px solid var(--bdr0); }
    .drawer-row { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); }
    .drawer-key { font-size: .78rem; color: var(--tx3); }
    .drawer-val { font-size: .8rem; color: var(--tx1); font-weight: 600; text-align: right; }
    .drawer-timeline { display: flex; gap: 0; }
    .tl-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .tl-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bdr1); background: var(--sur2); }
    .tl-dot.done { background: #22c55e; border-color: #22c55e; }
    .tl-dot.active { background: var(--royal-l); border-color: var(--royal-l); box-shadow: 0 0 6px rgba(99,102,241,.5); }
    .tl-line { position: relative; width: 100%; height: 2px; background: var(--bdr1); margin-top: 5px; }
    .tl-line.done { background: #22c55e; }
    .tl-label { font-size: .6rem; color: var(--tx3); text-align: center; }
    .payment-row { display: flex; justify-content: space-between; padding: var(--sp-2) 0; border-bottom: 1px solid var(--bdr0); font-size: .78rem; }
    /* Lista de consumos no painel (mesma leitura canônica do rooms.html) */
    .cmd-line { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); padding: 5px 0; border-bottom: 1px solid var(--bdr0); }
    .cmd-line:last-child { border-bottom: none; }
    .cmd-line .it  { font-size: .78rem; color: var(--tx1); font-weight: 600; }
    .cmd-line .qt  { font-size: .68rem; color: var(--tx3); margin-top: 1px; }
    .cmd-line .tot { font-size: .8rem; color: var(--tx1); font-weight: 700; text-align: right; white-space: nowrap; }
    .cmd-empty { font-size: .76rem; color: var(--tx3); font-style: italic; }
    .notes-textarea { width: 100%; box-sizing: border-box; min-height: 72px; padding: var(--sp-2); background: var(--sur2); border: 1px solid var(--bdr1); border-radius: var(--r-sm); color: var(--tx1); font-size: .8rem; resize: vertical; font-family: inherit; }
    .drawer-actions { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--bdr1); display: flex; gap: var(--sp-2); flex-wrap: wrap; flex-shrink: 0; }
    .drawer-actions .act-btn { flex: 1; justify-content: center; text-align: center; display: flex; }

    /* ══ MODAL ══ */
    .modal-overlay { position: fixed; inset: 0; background: rgba(2,6,12,.8); z-index: 300; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg1); border: 1px solid var(--bdr1); border-radius: var(--r-lg); width: 480px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; }
    .modal-header { padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--bdr1); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1rem; font-weight: 700; }
    .modal-body { padding: var(--sp-4) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); }
    .modal-footer { padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--bdr1); display: flex; justify-content: flex-end; gap: var(--sp-2); }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: .75rem; font-weight: 600; color: var(--tx2); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
    .form-input { height: 36px; padding: 0 var(--sp-3); background: var(--sur2); border: 1px solid var(--bdr1); border-radius: var(--r-sm); color: var(--tx1); font-size: .82rem; width: 100%; box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: var(--royal-l); }
    .lead-found { font-size: .75rem; color: #22c55e; margin-top: 3px; }

    /* ══ STATUS BADGE ══ */
    .sbadge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .68rem; font-weight: 700; }
    .sbadge-pending   { background: rgba(234,179,8,.18); color: #ca8a04; }
    .sbadge-confirmed { background: rgba(34,197,94,.15); color: #16a34a; }
    .sbadge-checkedin { background: rgba(99,102,241,.18); color: var(--royal-l); }
    .sbadge-checkedout { background: var(--sur2); color: var(--tx3); border: 1px solid var(--bdr1); }
    .sbadge-cancelled { background: rgba(239,68,68,.12); color: #dc2626; }
  </style>
</head>

<script>
'use strict';

// ─── Constants ───────────────────────────────────────────────────────────────

const ROOMS = [
  { ala:'A', code:'A1', name:'A1 — Vista Pomar', max:3 },
  { ala:'A', code:'A2', name:'A2 — Vista Pomar', max:3 },
  { ala:'A', code:'A3', name:'A3 — Vista Pomar', max:3 },
  { ala:'A', code:'A4', name:'A4 — Vista Pomar', max:4 },
  { ala:'A', code:'A5', name:'A5 — Vista Pomar', max:4 },
  { ala:'A', code:'A6', name:'A6 — Vista Pomar', max:4 },
  { ala:'A', code:'A7', name:'A7 — Vista Pomar', max:4 },
  { ala:'A', code:'A8', name:'A8 — Vista Pomar', max:4 },
  { ala:'B', code:'B1', name:'B1 — Vista Montanha', max:3 },
  { ala:'B', code:'B2', name:'B2 — Vista Montanha', max:6 },
  { ala:'B', code:'B3', name:'B3 — Vista Montanha', max:6 },
  { ala:'B', code:'B4', name:'B4 — Vista Montanha', max:6 },
  { ala:'B', code:'B5', name:'B5 — Vista Montanha', max:6 },
  { ala:'B', code:'B6', name:'B6 — Vista Montanha', max:6 },
  { ala:'B', code:'B7', name:'B7 — Vista Montanha', max:6 },
  { ala:'C', code:'C1', name:'C1 — Grupo', max:8 },
  { ala:'C', code:'C2', name:'C2 — Grupo', max:8 },
  { ala:'C', code:'C3', name:'C3 — Casal', max:2 },
  { ala:'C', code:'C4', name:'C4 — Casal', max:2 },
  { ala:'C', code:'C5', name:'C5 — Casal', max:2 },
];

const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_PT   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

const CHANNEL_LABEL = {
  whatsapp:'📱 WhatsApp', booking:'🏨 Booking', airbnb:'🏠 Airbnb',
  direct:'🔗 Direto', phone:'📞 Telefone', other:'⋯ Outro',
};

const STATUS_LABEL = {
  pending:'Pendente', confirmed:'Confirmada', checkedin:'No local',
  checkedout:'Saiu', cancelled:'Cancelada',
};

// ─── State ───────────────────────────────────────────────────────────────────

let allReservations = [];
let monthBlocks  = {};     // roomCode → { 'YYYY-MM-DD': block_reason } — manutenção/bloqueio (fonte única)
let boardData    = null;   // DEC-024: board canônico do dia (/api/occupancy/board)
let totalRooms   = 20;     // total de quartos físicos ativos (de /api/occupancy/rooms-today)
let currentView  = 'timeline';
let curYear, curMonth; // 0-based month
let searchDebounce = null;
let openReservation = null;
let editingId = null; // id da reserva em edição (null = modal em modo "nova reserva")

// ─── Init ────────────────────────────────────────────────────────────────────

(async () => {
  const session = await DS.requireAuth();
  if (!session) return;
  DS.initNav();

  const av = document.getElementById('user-avatar');
  if (av) av.textContent = (session.user.email||'').slice(0,2).toUpperCase();

  const now = new Date();
  curYear  = now.getFullYear();
  curMonth = now.getMonth();

  updatePeriodLabel();
  populateRoomSelect();
  await loadAndRender();
  bindEvents();
})();

// ─── Data ────────────────────────────────────────────────────────────────────

async function loadAndRender() {
  document.getElementById('loading-state').style.display = '';
  document.getElementById('gantt-container').style.display = 'none';
  document.getElementById('list-container').style.display = 'none';

  try {
    const from = `${curYear}-${String(curMonth+1).padStart(2,'0')}-01`;
    const lastDay = new Date(curYear, curMonth+1, 0).getDate();
    const to   = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${lastDay}`;

    const data = await DS.api(`/api/reservations?checkin_from=${from}&checkin_to=${to}&limit=500`);
    allReservations = data?.reservations || [];

    // Also load reservations that CHECKOUT in this month (started before)
    const data2 = await DS.api(`/api/reservations?checkin_to=${to}&limit=500`);
    const extra  = (data2?.reservations || []).filter(r =>
      r.checkout_date >= from && r.checkin_date < from
    );
    const ids = new Set(allReservations.map(r => r.id));
    extra.forEach(r => { if (!ids.has(r.id)) allReservations.push(r); });

    // DEC-024: KPIs de HOJE vêm da fonte única (sempre hoje, independe do mês visto)
    const [board, roomsToday] = await Promise.all([
      DS.api('/api/occupancy/board'),
      DS.api('/api/occupancy/rooms-today'),
    ]);
    boardData  = board || null;
    totalRooms = (roomsToday?.rooms || []).length || totalRooms;

    // Manutenção/bloqueios do mês (fonte única: availability blocked) → marca 🔧 na timeline
    const blocksRes = await DS.api(`/api/occupancy/calendar?from=${from}&to=${to}`);
    monthBlocks = {};
    for (const row of (blocksRes?.rows || [])) {
      if (row.status !== 'blocked') continue;
      (monthBlocks[row.room_code] ||= {})[row.date] = row.block_reason || '';
    }

  } catch(e) {
    document.getElementById('loading-state').innerHTML =
      `<div style="color:var(--err);padding:var(--sp-4)">Erro ao carregar: ${DS.esc(e.message)}</div>`;
    return;
  }

  renderKPIs();
  document.getElementById('loading-state').style.display = 'none';
  renderCurrentView();
}

// ─── KPIs ────────────────────────────────────────────────────────────────────

function renderKPIs() {
  // DEC-024: chegando/saindo/ocupados de HOJE vêm do board canônico (fuso BR,
  // exclui checkedout, fronteira de checkout correta) — sempre hoje, mesmo
  // navegando entre meses.
  const checkins  = boardData?.checkins  || [];
  const checkouts = boardData?.checkouts || [];
  const occupied  = boardData?.in_house  || [];

  // Revenue: confirmed + checkedin + checkedout this month
  const monStart = `${curYear}-${String(curMonth+1).padStart(2,'0')}-01`;
  const monEnd   = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${new Date(curYear,curMonth+1,0).getDate()}`;
  const revenue  = allReservations
    .filter(r => ['confirmed','checkedin','checkedout'].includes(r.status) && r.checkin_date >= monStart && r.checkin_date <= monEnd)
    .reduce((s,r) => s + parseFloat(r.total_amount||0), 0);

  document.getElementById('kpi-bar').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Chegando hoje</div>
      <div class="kpi-value t-ok">${checkins.length}</div>
      <div class="kpi-sub">${checkins.map(r=>DS.esc(r.guest_name||r.room_type)).join(', ')||'Nenhum'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Saindo hoje</div>
      <div class="kpi-value t-royal">${checkouts.length}</div>
      <div class="kpi-sub">${checkouts.map(r=>DS.esc(r.guest_name||r.room_type)).join(', ')||'Nenhum'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Quartos ocupados</div>
      <div class="kpi-value">${occupied.length}<span style="font-size:.9rem;color:var(--tx3);font-weight:400"> /${totalRooms}</span></div>
      <div class="kpi-sub">${totalRooms ? Math.round(occupied.length/totalRooms*100) : 0}% ocupação agora</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Receita do mês</div>
      <div class="kpi-value t-gold">${DS.cur(revenue)}</div>
      <div class="kpi-sub">${MONTHS_PT[curMonth]} ${curYear}</div>
    </div>`;
}

// ─── Filter ──────────────────────────────────────────────────────────────────

function getFiltered() {
  const search  = (document.getElementById('filter-search')?.value||'').toLowerCase();
  const status  = document.getElementById('filter-status')?.value||'';
  const ala     = document.getElementById('filter-ala')?.value||'';
  const channel = document.getElementById('filter-channel')?.value||'';

  return allReservations.filter(r => {
    if (status  && r.status !== status) return false;
    if (channel && r.channel !== channel) return false;
    if (ala && !(r.room_type||'').startsWith(ala)) return false;
    if (search) {
      const name = (r.leads?.name||'').toLowerCase();
      const room = (r.room_type||'').toLowerCase();
      if (!name.includes(search) && !room.includes(search)) return false;
    }
    return true;
  });
}

// ─── Timeline / Gantt ────────────────────────────────────────────────────────

function renderTimeline() {
  const container = document.getElementById('gantt-container');
  const filtered  = getFiltered();
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const today = new Date();
  const isCurrentMonth = today.getFullYear()===curYear && today.getMonth()===curMonth;
  const todayDay = isCurrentMonth ? today.getDate() : -1;

  // Build header
  let html = `<div class="gantt-grid" style="--days:${daysInMonth}">`;

  // Corner
  html += `<div class="gh-corner" style="font-size:.65rem;color:var(--tx3);font-weight:700">Quarto</div>`;

  // Day headers
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(curYear, curMonth, d);
    const dow  = date.getDay();
    const isWknd = dow===0||dow===6;
    const cls  = [d===todayDay?'is-today':'', isWknd?'is-weekend':''].filter(Boolean).join(' ');
    html += `<div class="gh-day ${cls}"><div class="day-num">${d}</div><div class="day-name">${DAYS_PT[dow]}</div></div>`;
  }

  // Group rooms by ala
  const alas = ['A','B','C'];
  for (const ala of alas) {
    const rooms = ROOMS.filter(r => r.ala===ala);
    html += `<div class="gantt-section">Ala ${ala}</div>`;

    for (const room of rooms) {
      // Reserva de quarto físico → linha do quarto. Reserva legada por ala
      // (ALA_A, ALA_B, ALA_C_1/2, vinda da Luna) → apenas na PRIMEIRA linha
      // da ala, senão uma reserva vira N barras "duplicadas".
      const isFirstRow = room === rooms[0];
      const roomResvs = filtered.filter(r =>
        r.room_type === room.code ||
        (isFirstRow && (r.room_type || '').startsWith(`ALA_${ala}`)));

      html += `<div class="gantt-room-label">${room.code}</div>`;
      html += `<div class="gantt-canvas" data-room="${room.code}">`;

      // Today stripe
      if (todayDay > 0) {
        const leftPct = (todayDay - 1) / daysInMonth * 100;
        const widPct  = 1 / daysInMonth * 100;
        html += `<div class="today-stripe" style="left:${leftPct}%;width:${widPct}%"></div>`;
      }

      for (const r of roomResvs) {
        const ci = new Date(r.checkin_date  + 'T00:00:00');
        const co = new Date(r.checkout_date + 'T00:00:00');
        const monthStart = new Date(curYear, curMonth, 1);
        const monthEnd   = new Date(curYear, curMonth+1, 1);

        const visStart = Math.max(ci, monthStart);
        const visEnd   = Math.min(co, monthEnd);
        if (visStart >= visEnd) continue;

        let startDay = (visStart - monthStart) / 86400000;
        let spanDays = (visEnd - visStart)   / 86400000;

        // Semântica de hotel: check-in 14h, check-out 12h. A barra começa no MEIO
        // da célula de entrada e termina no MEIO da célula de saída — assim no
        // turnover (saída + entrada no mesmo dia) a metade da manhã fica com quem
        // sai e a da tarde com quem entra, encontrando-se no meio da célula. Só
        // desloca quando a borda real cai dentro do mês visível; senão a reserva
        // vem de / segue para outro mês e a barra encosta na borda do calendário.
        // NÃO altera disponibilidade — o dia de saída segue vendável.
        if (ci >= monthStart) { startDay += 0.5; spanDays -= 0.5; }
        if (co <  monthEnd)   { spanDays += 0.5; }

        const leftPct  = startDay / daysInMonth * 100;
        const widPct   = spanDays / daysInMonth * 100;

        const isLegacyAla = (r.room_type || '').startsWith('ALA_');
        const name  = DS.esc(r.leads?.name || '?') + (isLegacyAla ? ` · ${DS.esc(r.room_type)}` : '');
        const sc    = `status-${r.status}`;
        html += `<div class="resv-bar ${sc}" style="left:${leftPct}%;width:calc(${widPct}% - 2px)"
          data-id="${r.id}" title="${name} · ${r.checkin_date} → ${r.checkout_date}${isLegacyAla ? ' (reserva por ala — quarto a definir)' : ''}">${name}</div>`;
      }

      // Manutenção/bloqueio do quarto (fonte única: availability blocked). 🔧 quando o
      // motivo começa por "Manutenção", senão 🔒 (bloqueio genérico). Fora da venda.
      const roomBlocks = monthBlocks[room.code] || {};
      for (let bd = 1; bd <= daysInMonth; bd++) {
        const bds    = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(bd).padStart(2,'0')}`;
        const reason = roomBlocks[bds];
        if (reason === undefined) continue;
        const isMaint = /^manuten/i.test(reason);
        html += `<div class="maint-block" style="left:${(bd-1)/daysInMonth*100}%;width:${1/daysInMonth*100}%" title="${DS.esc(reason || 'Bloqueado')}">${isMaint ? '🔧' : '🔒'}</div>`;
      }

      html += `</div>`;
    }
  }

  html += `</div>`;
  container.innerHTML = html;

  // Bar click → drawer
  container.querySelectorAll('.resv-bar[data-id]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const r = allReservations.find(x => x.id === el.dataset.id);
      if (r) openDrawer(r);
    });
  });

  // Drag para selecionar intervalo de datas no quarto → menu de ações
  bindTimelineDrag(container, daysInMonth);
}

// ─── Seleção por arraste (multi-período) ──────────────────────────────────────

// ISO local-safe (evita o shift de fuso do toISOString)
function ymdLocal(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function getDayFromX(offsetX, totalWidth, daysInMonth) {
  return Math.max(1, Math.min(daysInMonth, Math.ceil((offsetX / totalWidth) * daysInMonth)));
}

function bindTimelineDrag(container, daysInMonth) {
  let drag = { active: false, room: null, startDay: 0, endDay: 0 };

  container.querySelectorAll('.gantt-canvas').forEach(canvas => {
    const roomCode = canvas.dataset.room;
    let selEl = null;

    canvas.addEventListener('mousedown', e => {
      if (e.target.classList.contains('resv-bar')) return; // clique numa reserva
      closeBatchMenu();
      container.querySelectorAll('.drag-sel').forEach(el => el.remove()); // limpa seleção órfã de outra linha
      drag = { active: true, room: roomCode, startDay: getDayFromX(e.offsetX, canvas.offsetWidth, daysInMonth), endDay: 0 };
      selEl = document.createElement('div');
      selEl.className = 'drag-sel';
      canvas.appendChild(selEl);
    });

    canvas.addEventListener('mousemove', e => {
      if (!drag.active || drag.room !== roomCode || !selEl) return;
      drag.endDay = getDayFromX(e.offsetX, canvas.offsetWidth, daysInMonth);
      const s  = Math.min(drag.startDay, drag.endDay);
      const en = Math.max(drag.startDay, drag.endDay);
      selEl.style.left  = (s - 1) / daysInMonth * 100 + '%';
      selEl.style.width = Math.max(1, en - s + 1) / daysInMonth * 100 + '%';
    });

    canvas.addEventListener('mouseup', e => {
      if (!drag.active || drag.room !== roomCode) return;
      drag.active = false;
      if (selEl) { selEl.remove(); selEl = null; }
      const s  = Math.min(drag.startDay, drag.endDay || drag.startDay);
      const en = Math.max(drag.startDay, drag.endDay || drag.startDay);
      const checkin  = ymdLocal(new Date(curYear, curMonth, s));      // 1ª noite
      const checkout = ymdLocal(new Date(curYear, curMonth, en + 1)); // saída (exclusiva)
      showBatchMenu(roomCode, checkin, checkout, e.clientX, e.clientY);
    });
  });

  container.addEventListener('mouseleave', () => {
    drag.active = false;
    container.querySelectorAll('.drag-sel').forEach(el => el.remove());
  });
}

let _batchMenuEl = null;

function closeBatchMenu() {
  if (_batchMenuEl) { _batchMenuEl.remove(); _batchMenuEl = null; }
  document.removeEventListener('mousedown', onBatchOutside, true);
  document.removeEventListener('keydown', onBatchEsc, true);
}
function onBatchOutside(e) { if (_batchMenuEl && !_batchMenuEl.contains(e.target)) closeBatchMenu(); }
function onBatchEsc(e) { if (e.key === 'Escape') closeBatchMenu(); }

function showBatchMenu(roomCode, checkin, checkout, x, y) {
  closeBatchMenu();
  const nights = Math.round((new Date(checkout) - new Date(checkin)) / 86400000);
  const menu = document.createElement('div');
  menu.className = 'batch-menu';
  menu.innerHTML = `
    <div class="batch-menu-title">Quarto ${DS.esc(roomCode)} · ${nights} noite${nights===1?'':'s'}</div>
    <div class="batch-menu-range">${DS.date(checkin)} → ${DS.date(checkout)}</div>
    <button class="batch-menu-btn" data-batch="new">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nova reserva neste período
    </button>
    <div class="batch-menu-hint">Fechar quarto e preço em lote chegam nos próximos blocos.</div>`;
  document.body.appendChild(menu);
  _batchMenuEl = menu;

  // Posiciona dentro da viewport
  const mw = 232, mh = menu.offsetHeight || 120;
  menu.style.left = Math.min(x, window.innerWidth  - mw - 12) + 'px';
  menu.style.top  = Math.min(y, window.innerHeight - mh - 12) + 'px';

  menu.querySelector('[data-batch="new"]').addEventListener('click', () => {
    closeBatchMenu();
    openNewReservationPrefilled(roomCode, checkin, checkout);
  });

  // Fecha ao clicar fora ou Esc (captura na fase de captura para não conflitar)
  setTimeout(() => {
    document.addEventListener('mousedown', onBatchOutside, true);
    document.addEventListener('keydown', onBatchEsc, true);
  }, 0);
}

function openNewReservationPrefilled(roomCode, checkin, checkout) {
  resetModalForCreate();
  const sel = document.getElementById('modal-quarto');
  if (Array.from(sel.options).some(o => o.value === roomCode)) sel.value = roomCode;
  document.getElementById('modal-checkin').value  = checkin;
  document.getElementById('modal-checkout').value = checkout;
  document.getElementById('modal-overlay').classList.add('open');
}

    btns += `<button class="act-btn act-cancel" data-action="cancel" data-id="${id}">✕</button>`;
  }
  return btns;
}

// Adapter para CheckoutFlow/CheckoutGuard: precisa do JSON mesmo em HTTP não-ok
// (ex.: 422 balance_due), ao contrário do DS.api que lança. Mesmo contrato do
// cgApiFetch do rooms/map (body como objeto → serializado).
async function cgApiFetch(path, opts = {}) {
  const token = await DS.getToken();
  if (!token) { window.location.href = 'login.html'; return null; }
  let body = opts.body;
  if (body && typeof body === 'object') body = JSON.stringify(body);
  const res = await fetch(path, {
    ...opts, body,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(opts.headers || {}) },
  });
  if (res.status === 401) { window.location.href = 'login.html'; return null; }
  return res.json();
}

async function handleAction(action, id) {
  if (action === 'detail') {
    const r = allReservations.find(x => x.id===id);
    if (r) openDrawer(r);
    return;
  }
  if (action === 'edit') {
    const r = allReservations.find(x => x.id===id);
    if (r) openEditModal(r);
    return;
  }
  if (action === 'cancel') {
    if (!confirm('Cancelar esta reserva?')) return;
  }

  // Check-out: MESMO fluxo do rooms/map (módulo compartilhado CheckoutFlow) —
  // contagem de frigobar + trava de saldo/popup de pagamento + voucher.
  if (action === 'checkout') {
    const r = allReservations.find(x => x.id === id) || openReservation;
    const { done, voucher } = await CheckoutFlow.run({
      reservationId: id,
      roomCode:  r?.room_type || null,
      guestName: r?.leads?.name || '',
      apiFetch:  cgApiFetch,
      toast:     DS.toast,
    });
    if (!done) return;
    DS.toast('Checkout registrado.', 'ok');
    if (voucher?.download_url) window.open(voucher.download_url, '_blank');
    await loadAndRender();
    if (openReservation?.id === id) closeDrawer();
    return;
  }

  const endpoints = {
    confirm:  { method:'PATCH', url:`/api/reservations/${id}`, body:{ status:'confirmed' } },
    checkin:  { method:'PATCH', url:`/api/reservations/${id}/checkin` },
    cancel:   { method:'PATCH', url:`/api/reservations/${id}`, body:{ status:'cancelled' } },
  };

  const cfg = endpoints[action];
  if (!cfg) return;

  try {
    await DS.api(cfg.url, { method: cfg.method, body: cfg.body });
    DS.toast('Reserva atualizada', 'ok');
    await loadAndRender();
    if (openReservation?.id === id) {
      const updated = allReservations.find(r => r.id===id);
      if (updated) openDrawer(updated);
    }
  } catch(e) {
    DS.toast(e.message || 'Erro ao atualizar', 'err');
  }
}

// Saldo real do painel = fonte ÚNICA da comanda (mesma que rooms.html/frontdesk
// consomem): diárias + consumos − sinal − pagamentos. Não recalcula nada aqui.
async function hydrateDrawerFinance(r, total, deposit) {
  let cmd = null;
  try { cmd = await DS.api(`/api/room-charges/comanda/${r.id}`); }
  catch (e) { cmd = null; }

  const consEl = document.getElementById('drawer-consumos');
  const finEl  = document.getElementById('drawer-fin');
  // Drawer pode ter fechado ou trocado de reserva enquanto buscava
  if (!consEl || !finEl || openReservation?.id !== r.id) return;

  // Falha de rede: não inventa consumos; cai no saldo de diária − sinal e avisa
  if (!cmd || !cmd.success) {
    consEl.innerHTML = `<div class="drawer-section-title">Consumos</div>`
      + `<div class="cmd-empty">Não foi possível carregar os consumos.</div>`;
    const fb = total - deposit;
    finEl.innerHTML = `<div class="drawer-section-title">Financeiro</div>`
      + finRow('Total (diárias)', DS.cur(total), 'color:var(--gold);font-family:var(--f-serif)')
      + finRow('Sinal pago', DS.cur(deposit), 'color:#22c55e')
      + finRow('Saldo a receber', DS.cur(fb), `color:${fb>0?'#f59e0b':'var(--tx3)'}`);
    return;
  }

  const charges = cmd.charges || [];
  const t = cmd.totals || {};

  // Seção Consumos — item, qtd × unitário, total (igual rooms.html)
  if (charges.length === 0) {
    consEl.innerHTML = `<div class="drawer-section-title">Consumos</div><div class="cmd-empty">Nenhum consumo</div>`;
  } else {
    consEl.innerHTML = `<div class="drawer-section-title">Consumos</div>` + charges.map(c => {
      const nome = DS.esc(c.products?.name || 'Item');
      const qt   = Number(c.quantity || 0);
      const unit = Number(c.unit_price || 0);
      const tot  = Number(c.total || 0);
      return `<div class="cmd-line"><div><div class="it">${nome}</div><div class="qt">${qt} × ${DS.cur(unit)}</div></div><div class="tot">${DS.cur(tot)}</div></div>`;
    }).join('');
  }

  // Seção Financeiro — saldo canônico
  let rows = finRow('Total (diárias)', DS.cur(t.room_total ?? total), 'color:var(--gold);font-family:var(--f-serif)')
    + finRow('Consumos', DS.cur(t.charges_total ?? 0), 'color:var(--tx1)')
    + finRow('Sinal pago', DS.cur(t.deposit_paid ?? deposit), 'color:#22c55e');
  if (Number(t.payments_confirmed || 0) > 0) {
    rows += finRow('Pagamentos recebidos', DS.cur(t.payments_confirmed), 'color:#22c55e');
  }
  const bal = Number(t.balance_due ?? (total - deposit));
  rows += finRow('Saldo a receber', DS.cur(bal), `color:${bal>0?'#f59e0b':'var(--tx3)'};font-weight:800`);
  finEl.innerHTML = `<div class="drawer-section-title">Financeiro</div>` + rows;
}

function finRow(k, v, style = '') {
  return `<div class="drawer-row"><span class="drawer-key">${k}</span><span class="drawer-val" style="${style}">${v}</span></div>`;
}

function buildDrawerActions(r) {
  let html = '';
  if (r.status === 'pending')   html += `<button class="act-btn act-confirm" data-action="confirm" data-id="${r.id}">✓ Confirmar</button>`;
  if (r.status === 'confirmed') html += `<button class="act-btn act-checkin" data-action="checkin" data-id="${r.id}">🏠 Check-in</button>`;
  if (r.status === 'checkedin') html += `<button class="act-btn act-checkout" data-action="checkout" data-id="${r.id}">🚪 Check-out</button>`;

}

let foundLeadId = null;

async function searchLead() {
  const digits = (document.getElementById('modal-whatsapp').value||'').replace(/\D/g,'');
  const foundEl = document.getElementById('lead-found');
  foundEl.style.display = 'none';
  foundLeadId = null;
  if (digits.length < 8) return;
  try {
    const data = await DS.api(`/api/leads?search=${encodeURIComponent(digits)}&limit=5`);
    const leads = data?.leads || data?.data || [];
    // só aceita lead cujo número realmente contém os dígitos buscados
    const match = leads.find(l => (l.whatsapp_number||'').replace(/\D/g,'').includes(digits));
    if (match) {
      foundLeadId = match.id;
      if (match.name) document.getElementById('modal-nome').value = match.name;
      foundEl.textContent = `✓ Lead encontrado: ${match.name||match.whatsapp_number} — confira e edite os dados se precisar`;
      foundEl.style.color = '#22c55e';
    } else {
      document.getElementById('modal-nome').value = '';
      foundEl.textContent = 'Número não cadastrado — preencha o nome para criar o hóspede';
      foundEl.style.color = 'var(--tx3)';
    }
    foundEl.style.display = 'block';
  } catch(e) { /* silent */ }
}

async function submitNewReservation() {
  const whatsapp = (document.getElementById('modal-whatsapp').value||'').trim();
  const nome     = (document.getElementById('modal-nome').value||'').trim();
  const checkin  = document.getElementById('modal-checkin').value;
  const checkout = document.getElementById('modal-checkout').value;
  const room     = document.getElementById('modal-quarto').value;
  const guests   = parseInt(document.getElementById('modal-guests').value)||2;
  const total    = parseFloat(document.getElementById('modal-total').value)||0;
  const depRaw   = (document.getElementById('modal-deposit').value||'').trim();
  const deposit  = depRaw === '' ? Math.round(total*.3) : (parseFloat(depRaw)||0); // vazio = 30%; "0" digitado = sem sinal
  const channel  = document.getElementById('modal-channel').value;
  const placa    = document.getElementById('modal-placa').value.trim().toUpperCase().replace(/\s/g, '');

  const errEl = document.getElementById('modal-error');
  errEl.style.display = 'none';

  if (!whatsapp || !nome || !checkin || !checkout || !total) {
    errEl.textContent = 'Preencha: WhatsApp, nome, datas e valor total.';
    errEl.style.display = 'block';
    return;
  }

  const waDigits = whatsapp.replace(/\D/g, '');
  if (waDigits.length < 10 || waDigits.length > 15) {
    errEl.textContent = `WhatsApp deve ter 10–15 dígitos com país+DDD (ex: 5519999999999). Você digitou ${waDigits.length} dígitos.`;
    errEl.style.display = 'block';
    return;
  }

  try {
    document.getElementById('modal-submit-btn').disabled = true;
    document.getElementById('modal-submit-btn').textContent = 'Criando…';

    // Lead: cria via upsert se não existe; se existe e o nome foi editado, atualiza
    let leadId = foundLeadId;
    if (!leadId) {
      const ld = await DS.api('/api/leads/upsert', {
        method: 'POST',
        body: { whatsapp_number: whatsapp.replace(/\D/g,''), name: nome },
      });
      leadId = ld?.lead_id || ld?.lead?.id;
    } else {
      await DS.api(`/api/leads/${leadId}`, { method:'PATCH', body:{ name: nome } }).catch(() => {});
    }

    if (!leadId) throw new Error('Não foi possível criar o lead');

    const created = await DS.api('/api/reservations/confirm', {
      method: 'POST',
      body: { leadId, whatsapp, roomType: room, checkin, checkout, guests, totalAmount: total, depositAmount: deposit },
    });

    // /confirm não grava canal nem placa — registra em seguida
    if (created?.reservation_id && (channel || placa)) {
      const extras = {};
      if (channel) extras.channel = channel;
      if (placa)   extras.vehicle_plate = placa;
      await DS.api(`/api/reservations/${created.reservation_id}`, { method:'PATCH', body: extras }).catch(() => {});
    }

    DS.toast('Reserva criada com sucesso', 'ok');
    document.getElementById('modal-overlay').classList.remove('open');
    await loadAndRender();
  } catch(e) {
    errEl.textContent = e.message || 'Erro ao criar reserva';
    errEl.style.display = 'block';
  } finally {
    document.getElementById('modal-submit-btn').disabled = false;
    document.getElementById('modal-submit-btn').textContent = 'Criar reserva';
  }
}

// ─── Modal editar reserva ─────────────────────────────────────────────────────

function resetModalForCreate() {
  editingId = null;
  foundLeadId = null;
  document.getElementById('modal-title').textContent = 'Nova Reserva';
  document.getElementById('modal-submit-btn').textContent = 'Criar reserva';
  ['modal-whatsapp','modal-nome','modal-checkin','modal-checkout','modal-total','modal-deposit','modal-placa']
    .forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('modal-guests').value  = 2;
  document.getElementById('modal-channel').value = 'whatsapp';
  // remove opções de ala legada injetadas em edições anteriores
  const sel = document.getElementById('modal-quarto');
  Array.from(sel.options).forEach(o => { if (o.dataset.legacy) o.remove(); });
  sel.selectedIndex = 0;
  document.getElementById('lead-found').style.display = 'none';
  document.getElementById('modal-error').style.display = 'none';
}

function openEditModal(r) {
  editingId   = r.id;
  foundLeadId = r.leads?.id || null;

  document.getElementById('modal-title').textContent = 'Editar Reserva';
  document.getElementById('modal-submit-btn').textContent = 'Salvar alterações';

  document.getElementById('modal-whatsapp').value = r.leads?.whatsapp_number || '';
  document.getElementById('modal-nome').value     = r.leads?.name || '';
  document.getElementById('modal-checkin').value  = r.checkin_date || '';
  document.getElementById('modal-checkout').value = r.checkout_date || '';

  // Quarto: reservas legadas por ala (ALA_A, ALA_C_1…) não estão no ROOMS do
  // select. Injeta uma opção temporária para não trocar o quarto sem querer.
  const sel = document.getElementById('modal-quarto');
  Array.from(sel.options).forEach(o => { if (o.dataset.legacy) o.remove(); });
  if (r.room_type && !Array.from(sel.options).some(o => o.value === r.room_type)) {
    const opt = document.createElement('option');
    opt.value = r.room_type;
    opt.textContent = `${r.room_type} — reserva por ala (legado)`;
    opt.dataset.legacy = '1';
    sel.insertBefore(opt, sel.firstChild);
  }
  sel.value = r.room_type || '';

  document.getElementById('modal-guests').value  = r.guests || 2;
  document.getElementById('modal-total').value   = r.total_amount  || '';
  document.getElementById('modal-deposit').value = r.deposit_amount || '';
  document.getElementById('modal-placa').value   = r.vehicle_plate || '';
  document.getElementById('modal-channel').value = r.channel || 'whatsapp';

  document.getElementById('lead-found').style.display = 'none';
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
}

async function submitEditReservation() {
  const whatsapp = (document.getElementById('modal-whatsapp').value||'').trim();
  const nome     = (document.getElementById('modal-nome').value||'').trim();
  const checkin  = document.getElementById('modal-checkin').value;
  const checkout = document.getElementById('modal-checkout').value;
  const room     = document.getElementById('modal-quarto').value;
  const guests   = parseInt(document.getElementById('modal-guests').value)||2;
  const total    = parseFloat(document.getElementById('modal-total').value)||0;
  const depRaw   = (document.getElementById('modal-deposit').value||'').trim();
  const deposit  = depRaw === '' ? Math.round(total*.3) : (parseFloat(depRaw)||0);
  const channel  = document.getElementById('modal-channel').value;
  const placa    = document.getElementById('modal-placa').value.trim().toUpperCase().replace(/\s/g, '');

  const errEl = document.getElementById('modal-error');
  errEl.style.display = 'none';

  if (!whatsapp || !nome || !checkin || !checkout || !total) {
    errEl.textContent = 'Preencha: WhatsApp, nome, datas e valor total.';
    errEl.style.display = 'block';
    return;
  }
  const waDigits = whatsapp.replace(/\D/g, '');
  if (waDigits.length < 10 || waDigits.length > 15) {
    errEl.textContent = `WhatsApp deve ter 10–15 dígitos com país+DDD (ex: 5519999999999). Você digitou ${waDigits.length} dígitos.`;
    errEl.style.display = 'block';
    return;
  }
  if (checkout <= checkin) {
    errEl.textContent = 'Check-out deve ser depois do check-in.';
    errEl.style.display = 'block';
    return;
  }

  const submitBtn = document.getElementById('modal-submit-btn');
  try {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Salvando…';

    // 1. Corrige o lead vinculado (nome + número)
    if (foundLeadId) {
      await DS.api(`/api/leads/${foundLeadId}`, {
        method: 'PATCH',
        body: { name: nome, whatsapp_number: waDigits },
      });
    }

    // 2. Atualiza reserva + recalcula disponibilidade (RPC atômica)
    await DS.api(`/api/reservations/${editingId}/update`, {
      method: 'POST',
      body: {
        room_type: room, checkin, checkout, guests,
        total_amount: total, deposit_amount: deposit,
        channel, vehicle_plate: placa,
      },
    });

    DS.toast('Reserva atualizada', 'ok');
    document.getElementById('modal-overlay').classList.remove('open');
    const editedId = editingId;
    editingId = null;
    await loadAndRender();
    if (openReservation?.id === editedId) {
      const updated = allReservations.find(r => r.id === editedId);
      if (updated) openDrawer(updated); else closeDrawer();
    }
  } catch(e) {
    errEl.textContent = e.message || 'Erro ao salvar alterações';
    errEl.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = editingId ? 'Salvar alterações' : 'Criar reserva';
  }
}

// ─── View rendering ───────────────────────────────────────────────────────────

function renderCurrentView() {
  const gc = document.getElementById('gantt-container');
  const lc = document.getElementById('list-container');
  if (currentView === 'timeline') {
    lc.style.display = 'none';
    gc.style.display = 'block';
    renderTimeline();
  } else {
    gc.style.display = 'none';
    lc.style.display = 'block';
    renderList();
  }
}

function updatePeriodLabel() {
  document.getElementById('period-label').textContent = `${MONTHS_PT[curMonth]} ${curYear}`;
}

// ─── Events ───────────────────────────────────────────────────────────────────

function bindEvents() {
  // Month nav
  document.getElementById('prev-month').addEventListener('click', () => {
    curMonth--; if (curMonth < 0) { curMonth=11; curYear--; }
    updatePeriodLabel();
    loadAndRender();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    curMonth++; if (curMonth > 11) { curMonth=0; curYear++; }
    updatePeriodLabel();
    loadAndRender();
  });

  // View toggle
  document.getElementById('view-timeline').addEventListener('click', () => {
    currentView = 'timeline';
    document.getElementById('view-timeline').classList.add('active');
    document.getElementById('view-lista').classList.remove('active');
    renderCurrentView();
  });
  document.getElementById('view-lista').addEventListener('click', () => {
    currentView = 'lista';
    document.getElementById('view-lista').classList.add('active');
    document.getElementById('view-timeline').classList.remove('active');
    renderCurrentView();
  });

  // Filters
  ['filter-status','filter-ala','filter-channel'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => renderCurrentView());
  });
  document.getElementById('filter-search')?.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => renderCurrentView(), 300);
  });

  // Drawer
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
  document.getElementById('drawer-actions').addEventListener('click', e => {
    const btn = e.target.closest('.act-btn[data-action]');
    if (btn) handleAction(btn.dataset.action, btn.dataset.id);
  });

  // Modal
  document.getElementById('btn-nova-reserva').addEventListener('click', () => {
    resetModalForCreate();
    document.getElementById('modal-overlay').classList.add('open');
  });
  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('open');
  });
  document.getElementById('modal-cancel-btn').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('open');
  });
  document.getElementById('btn-search-lead').addEventListener('click', searchLead);
  document.getElementById('modal-whatsapp').addEventListener('keydown', e => {
    if (e.key==='Enter') searchLead();
  });
  document.getElementById('modal-total').addEventListener('input', () => {
    const total = parseFloat(document.getElementById('modal-total').value)||0;
    document.getElementById('modal-deposit').value = Math.round(total * 0.3);
  });
  document.getElementById('modal-submit-btn').addEventListener('click', () => {
    if (editingId) submitEditReservation();
    else submitNewReservation();
  });
}
</script>
