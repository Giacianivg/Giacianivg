<!DOCTYPE html>
<html lang="pt-BR" data-theme="luar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar — Disponibilidade e preços | Pousada Luz da Lua</title>
  <meta name="description" content="Consulte disponibilidade e preço real para suas datas na Pousada Luz da Lua, Socorro-SP.">
  <meta name="robots" content="noindex"><!-- página transacional, fora do índice -->
  <link rel="stylesheet" href="../design-system/t.css">
  <link rel="stylesheet" href="../design-system/c.css">
  <link rel="stylesheet" href="../design-system/l.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="luar.css">
  <style>
    .res-wrap { max-width: 920px; margin: 0 auto; padding: var(--space-lg); }
    .res-head { text-align: center; margin: var(--space-lg) 0; }
    .res-head h1 { font-family: var(--font-serif); font-size: var(--fz-h1); color: var(--tx1); letter-spacing: var(--ls-tight); margin-bottom: var(--space-xs); }
    .res-head p { color: var(--tx2); }

    .search-card {
      background: var(--sur1); border: 1px solid var(--bdr); border-radius: var(--radius-lg);
      padding: var(--space-md); box-shadow: var(--shadow-md);
      display: grid; grid-template-columns: 1fr 1fr 0.8fr auto; gap: var(--space-sm); align-items: end;
    }
    .field label { display: block; font-size: var(--fz-caption); font-weight: var(--fw-semibold); color: var(--tx2); margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--input-bdr); border-radius: var(--radius-md);
      background: var(--input-bg); color: var(--tx1); font-size: var(--fz-body-sm);
    }
    @media (max-width: 720px){ .search-card { grid-template-columns: 1fr 1fr; } }

    #cf-turnstile { margin: var(--space-sm) auto 0; display: flex; justify-content: center; }
    .results { margin-top: var(--space-lg); display: flex; flex-direction: column; gap: var(--space-sm); }
    .offer {
      background: var(--bg0); border: 1px solid var(--bdr); border-radius: var(--radius-lg);
      padding: var(--space-md); display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm); flex-wrap: wrap;
    }
    .offer.sold { opacity: .6; }
    .offer-info h3 { font-size: var(--fz-body-lg); color: var(--tx1); margin-bottom: var(--space-2xs); }
    .offer-info .meta { font-size: var(--fz-caption); color: var(--tx3); }
    .offer-info .notice { font-size: var(--fz-caption); color: var(--warn); margin-top: var(--space-2xs); }
    .offer-price { text-align: right; }
    .offer-price .amount { font-size: var(--fz-h3); font-weight: var(--fw-bold); color: var(--tx1); font-family: var(--font-serif); }
    .offer-price .per { font-size: var(--fz-caption); color: var(--tx3); }
    .badge-sold { font-size: var(--fz-caption); font-weight: var(--fw-semibold); color: var(--err); background: var(--err-bg); padding: 3px 10px; border-radius: var(--radius-pill); }
    .state { text-align: center; color: var(--tx2); padding: var(--space-lg); }
    .state.err { color: var(--err); }
    .group-box { background: var(--royal-bg); border: 1px solid var(--royal-bdr); border-radius: var(--radius-lg); padding: var(--space-md); text-align: center; color: var(--tx1); }
    .back { display: inline-block; margin-bottom: var(--space-sm); color: var(--royal-l); text-decoration: none; font-size: var(--fz-body-sm); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: var(--space-sm); z-index: var(--z-modal); }
    .modal-overlay[hidden] { display: none; }
    .modal-card { background: var(--sur0); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: var(--space-md); max-width: 440px; width: 100%; position: relative; }
    .modal-close { position: absolute; top: 10px; right: 14px; background: none; border: none; font-size: 1.5rem; color: var(--tx3); cursor: pointer; line-height: 1; }
  </style>
</head>
<body>

<nav class="landing-nav">
  <a href="index.html" style="display:flex;align-items:center;gap:var(--space-sm);text-decoration:none">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="16" fill="var(--royal-bg)"/><path d="M21 16a8 8 0 01-8 8 8 8 0 010-16 6 6 0 000 8z" fill="var(--royal-l)" opacity=".9"/><circle cx="12" cy="9" r="1.5" fill="var(--gold)" opacity=".7"/></svg>
    <span style="font-family:var(--font-serif);font-weight:var(--fw-semibold);color:var(--tx1);font-size:var(--fz-body-sm)">Luz da Lua</span>
  </a>
  <a href="https://wa.me/5519998400306" target="_blank" rel="noopener" class="btn btn-primary btn-sm">WhatsApp</a>
</nav>

<div class="res-wrap">
  <a href="index.html" class="back">← Voltar ao início</a>
  <div class="res-head">
    <h1>Disponibilidade e preços</h1>
    <p>Escolha suas datas e veja o valor real de cada acomodação.</p>
  </div>

  <form class="search-card" id="searchForm">
    <div class="field">
      <label for="checkin">Check-in</label>
      <input type="date" id="checkin" required>
    </div>
    <div class="field">
      <label for="checkout">Check-out</label>
      <input type="date" id="checkout" required>
    </div>
    <div class="field">
      <label for="guests">Hóspedes</label>
      <select id="guests">
        <option>1</option><option selected>2</option><option>3</option><option>4</option>
        <option>5</option><option>6</option><option>7</option><option>8</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary" id="searchBtn">Buscar</button>
  </form>

  <div id="cf-turnstile"></div>

  <div class="results" id="results"></div>
</div>

<!-- Modal de reserva (Bloco 3) -->
<div class="modal-overlay" id="bookModal" hidden>
  <div class="modal-card">
    <button class="modal-close" id="bookClose" aria-label="Fechar">×</button>
    <div id="bookStepForm">
      <h2 style="font-family:var(--font-serif);color:var(--tx1);margin-bottom:var(--space-2xs)">Finalizar reserva</h2>
      <p id="bookSummary" style="color:var(--tx2);font-size:var(--fz-body-sm);margin-bottom:var(--space-md)"></p>
      <form id="bookForm">
        <div class="field" style="margin-bottom:var(--space-sm)">
          <label for="bkName">Nome completo</label>
          <input type="text" id="bkName" required autocomplete="name">
        </div>
        <div class="field" style="margin-bottom:var(--space-sm)">
          <label for="bkWhats">WhatsApp (com DDD)</label>
          <input type="tel" id="bkWhats" required placeholder="(19) 99999-9999" autocomplete="tel">
        </div>
        <div class="field" style="margin-bottom:var(--space-md)">
          <label for="bkEmail">E-mail (opcional)</label>
          <input type="email" id="bkEmail" autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary" id="bkSubmit" style="width:100%">Reservar e segurar o quarto</button>
        <p id="bkError" class="state err" style="display:none;padding:var(--space-sm) 0 0"></p>
      </form>
    </div>
    <div id="bookStepDone" hidden style="text-align:center">
      <div style="font-size:2rem">✅</div>
      <h2 style="font-family:var(--font-serif);color:var(--tx1);margin:var(--space-xs) 0">Reserva pré-confirmada!</h2>
      <p id="bookDoneMsg" style="color:var(--tx2);line-height:1.6"></p>
      <a id="bookDoneWa" href="#" target="_blank" rel="noopener" class="btn btn-primary" style="margin-top:var(--space-sm)">Finalizar pagamento no WhatsApp</a>
      <p style="font-size:var(--fz-caption);color:var(--tx3);margin-top:var(--space-sm)">O pagamento por PIX direto no site chega em breve.</p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── Cloudflare Turnstile ─────────────────────────────────────────────────
  // Cole aqui o SITE KEY do Turnstile (público). Vazio = captcha desativado (dev).
  // O SECRET KEY correspondente vai como TURNSTILE_SECRET_KEY na Vercel (backend).
  var TURNSTILE_SITEKEY = '';

  var WA = 'https://wa.me/5519998400306';
  var checkinEl = document.getElementById('checkin');
  var checkoutEl = document.getElementById('checkout');
  var guestsEl = document.getElementById('guests');
  var resultsEl = document.getElementById('results');
  var form = document.getElementById('searchForm');

  // Date picker: impede datas impossíveis (hoje em diante; checkout > checkin).
  var today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
  checkinEl.min = today;
  checkoutEl.min = today;
  checkinEl.addEventListener('change', function () {
    var d = new Date(checkinEl.value + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    var next = d.toLocaleDateString('en-CA');
    checkoutEl.min = next;
    if (!checkoutEl.value || checkoutEl.value <= checkinEl.value) checkoutEl.value = next;
  });

  // ── Access token (verifica Turnstile uma vez, reusa por 15 min) ───────────
  var accessToken = null;
  var turnstileToken = null;

  window.onTurnstileOk = function (tok) { turnstileToken = tok; };

  if (TURNSTILE_SITEKEY) {
    var s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
    s.async = true; s.defer = true;
    document.head.appendChild(s);
    var w = document.getElementById('cf-turnstile');
    w.className = 'cf-turnstile';
    w.setAttribute('data-sitekey', TURNSTILE_SITEKEY);
    w.setAttribute('data-callback', 'onTurnstileOk');
  }

  function ensureAccess() {
    if (accessToken) return Promise.resolve(accessToken);
    return fetch('/api/public/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ turnstile_token: turnstileToken }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.success) throw new Error(d.message || 'Falha na verificação.');
        accessToken = d.access_token;
        return accessToken;
      });
  }

  function fmtBRL(n) { return 'R$ ' + Number(n).toLocaleString('pt-BR'); }

  function offerCard(o, ctx) {
    var div = document.createElement('div');
    div.className = 'offer' + (o.available ? '' : ' sold');

    var info = '<div class="offer-info"><h3>' + o.label + '</h3>' +
      '<div class="meta">Até ' + o.max_guests + ' hóspedes · ' + o.nights + ' noite' + (o.nights > 1 ? 's' : '') + '</div>';
    if (o.notice) info += '<div class="notice">⚠️ ' + o.notice + '</div>';
    info += '</div>';

    var right;
    if (!o.available) {
      right = '<div class="offer-price"><span class="badge-sold">Esgotado</span></div>';
    } else if (o.total_price == null) {
      right = '<div class="offer-price"><span class="per">consultar</span></div>';
    } else {
      right = '<div class="offer-price">' +
        '<div class="amount">' + fmtBRL(o.total_price) + '</div>' +
        '<div class="per">total · ' + o.nights + ' noite' + (o.nights > 1 ? 's' : '') +
          (o.desconto ? ' · ' + o.desconto + '% desc.' : '') + '</div>' +
        // Bloco 3: abre o modal de reserva (pending + hold). PIX entra no Bloco 4.
        '<button class="btn btn-primary btn-sm book-btn" style="margin-top:8px" ' +
          'data-room="' + o.room_type + '" data-label="' + o.label + '" data-total="' + o.total_price + '">Reservar</button>' +
        '</div>';
    }
    div.innerHTML = info + right;
    return div;
  }

  function render(data) {
    resultsEl.innerHTML = '';
    if (data.group_inquiry) {
      resultsEl.innerHTML = '<div class="group-box">Para grupos maiores, montamos uma proposta sob medida. ' +
        '<a href="' + WA + '?text=' + encodeURIComponent('Olá! Quero uma proposta para grupo.') +
        '" target="_blank" rel="noopener" class="btn btn-primary btn-sm" style="margin-top:8px">Falar com a equipe</a></div>';
      return;
    }
    if (!data.offers || !data.offers.length) {
      resultsEl.innerHTML = '<div class="state">Nenhuma acomodação para esses critérios. Tente outras datas.</div>';
      return;
    }
    lastSearch = { checkin: data.checkin, checkout: data.checkout, guests: data.guests };
    data.offers.forEach(function (o) { resultsEl.appendChild(offerCard(o, lastSearch)); });
  }

  // ── Reserva (Bloco 3): modal → POST /api/public/book ──────────────────────
  var lastSearch = null;
  var modal = document.getElementById('bookModal');
  var stepForm = document.getElementById('bookStepForm');
  var stepDone = document.getElementById('bookStepDone');
  var bookForm = document.getElementById('bookForm');
  var current = null;

  function openModal(offer) {
    current = offer;
    document.getElementById('bookSummary').textContent =
      offer.label + ' · ' + lastSearch.checkin + ' a ' + lastSearch.checkout + ' · ' +
      lastSearch.guests + ' hóspede(s) · total ' + fmtBRL(offer.total);
    stepForm.hidden = false; stepDone.hidden = true;
    document.getElementById('bkError').style.display = 'none';
    bookForm.reset();
    modal.hidden = false;
  }
  function closeModal() { modal.hidden = true; current = null; }

  document.getElementById('bookClose').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

  resultsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.book-btn');
    if (!btn) return;
    openModal({ room_type: btn.dataset.room, label: btn.dataset.label, total: Number(btn.dataset.total) });
  });

  bookForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!current || !lastSearch) return;
    var errEl = document.getElementById('bkError');
    var submitBtn = document.getElementById('bkSubmit');
    errEl.style.display = 'none';
    submitBtn.disabled = true; submitBtn.textContent = 'Reservando…';

    ensureAccess()
      .then(function (tok) {
        return fetch('/api/public/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-pub-token': tok },
          body: JSON.stringify({
            name: document.getElementById('bkName').value,
            whatsapp: document.getElementById('bkWhats').value,
            email: document.getElementById('bkEmail').value,
            room_type: current.room_type,
            checkin: lastSearch.checkin,
            checkout: lastSearch.checkout,
            guests: lastSearch.guests,
          }),
        });
      })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        submitBtn.disabled = false; submitBtn.textContent = 'Reservar e segurar o quarto';
        if (!res.d.success) {
          if (res.status === 401) accessToken = null;
          errEl.textContent = res.d.message || 'Não foi possível reservar.';
          errEl.style.display = 'block';
          return;
        }
        var d = res.d;
        document.getElementById('bookDoneMsg').innerHTML =
          'Reserva <strong>' + d.reservation_number + '</strong> segura por <strong>' + d.hold_minutes +
          ' minutos</strong>.<br>Total ' + fmtBRL(d.total_amount) + ' · sinal de ' + fmtBRL(d.deposit_amount) +
          ' (30%) para confirmar.';
        var wmsg = encodeURIComponent('Olá! Fiz a reserva ' + d.reservation_number + ' (' + current.label + ', ' +
          lastSearch.checkin + ' a ' + lastSearch.checkout + '). Quero pagar o sinal de ' + fmtBRL(d.deposit_amount) + '.');
        document.getElementById('bookDoneWa').href = WA + '?text=' + wmsg;
        stepForm.hidden = true; stepDone.hidden = false;
      })
      .catch(function (err) {
        submitBtn.disabled = false; submitBtn.textContent = 'Reservar e segurar o quarto';
        errEl.textContent = err.message; errEl.style.display = 'block';
      });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!checkinEl.value || !checkoutEl.value) return;
    resultsEl.innerHTML = '<div class="state">Buscando disponibilidade…</div>';

    ensureAccess()
      .then(function (tok) {
        var qs = new URLSearchParams({ checkin: checkinEl.value, checkout: checkoutEl.value, guests: guestsEl.value });
        return fetch('/api/public/offers?' + qs.toString(), { headers: { 'x-pub-token': tok } });
      })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        if (!res.d.success) {
          resultsEl.innerHTML = '<div class="state err">' + (res.d.message || 'Não foi possível buscar agora.') + '</div>';
          if (res.status === 401) accessToken = null; // força nova verificação
          return;
        }
        render(res.d);
      })
      .catch(function (err) {
        resultsEl.innerHTML = '<div class="state err">' + err.message + '</div>';
      });
  });
})();
</script>

<!-- u.js NÃO é carregado aqui de propósito: seu initTheme() lê localStorage('ldl-theme')
     e sobrescreveria o tema "luar" da landing pelo tema do CRM. A landing não usa funções do u.js. -->
</body>
</html>
