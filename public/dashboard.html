      <div class="theme-toggle">
        <span>Tema claro</span>

      </div>
      <div class="sidebar-user">
        <div class="avatar avatar-sm" id="user-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-email" data-user-email></div>
        </div>
        <button class="btn-ghost btn btn-icon" data-action="logout" title="Sair">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>

  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="page-title">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <span class="t-3" style="font-size:.8125rem" id="last-updated"></span>
      </div>

    <main class="page-body">
      <!-- KPI Row -->
      <div class="g4" id="kpi-row" style="margin-bottom:var(--sp-6)">
        <div class="skel skel-card"></div>
        <div class="skel skel-card"></div>
        <div class="skel skel-card"></div>
        <div class="skel skel-card"></div>
      </div>

      <div class="g2-1" style="margin-bottom:var(--sp-6)">
        <!-- Funnel -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Funil de Conversão</span>
            <a href="leads.html" class="btn btn-ghost btn-sm">Ver leads →</a>
          </div>
          <div class="panel-body" id="funnel-panel">
            <div class="skel skel-card" style="height:160px"></div>
          </div>
        </div>

        <!-- Alerts -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Alertas</span>
            <span class="badge badge-err" id="alert-count" style="display:none"></span>
          </div>
          <div class="panel-body" id="alerts-panel" style="padding:0">
            <div style="padding:var(--sp-4)"><div class="skel skel-text"></div></div>
          </div>
        </div>
      </div>

      <!-- Recent Leads -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Leads Recentes</span>
          <a href="leads.html" class="btn btn-ghost btn-sm">Ver todos →</a>
        </div>
        <div class="panel-body-flush">
          <div id="leads-table"><div style="padding:var(--sp-4)"><div class="skel skel-card" style="height:120px"></div></div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container"></div>
<script src="design-system/u.js"></script>
<script>
(async () => {
  const session = await DS.requireAuth();
  if (!session) return;
  DS.initNav();

  // Set user avatar initials
  const email = session.user.email || '';
  const avEl = document.getElementById('user-avatar');
  if (avEl) avEl.textContent = email.slice(0,2).toUpperCase();

  const now = new Date();
  document.getElementById('last-updated').textContent = 'Atualizado ' + DS.datetime(now);

  // Load all in parallel
  const [leadsRes, funnelRes, pipelineRes, alertsRes] = await Promise.allSettled([
    DS.api('/api/leads?limit=8'),
    DS.api('/api/analytics/funnel'),
    DS.api('/api/analytics/revenue/pipeline'),
    DS.api('/api/alerts/active')
  ]);

  // KPI row
  const pipeline = pipelineRes.status === 'fulfilled' ? pipelineRes.value : null;
  const leads    = leadsRes.status === 'fulfilled' ? leadsRes.value : null;
  const funnel   = funnelRes.status === 'fulfilled' ? funnelRes.value : null;

  const totalLeads    = leads?.total ?? leads?.leads?.length ?? '—';
  const pipelineVal   = pipeline?.total_pipeline ?? pipeline?.pipeline ?? '—';
  const convRate      = funnel?.conversion_rate ?? funnel?.conversionRate ?? '—';
  const confirmedRes  = pipeline?.confirmed_count ?? pipeline?.confirmed ?? '—';

  document.getElementById('kpi-row').innerHTML = `
    <div class="metric-card">
      <div class="metric-label">Leads Ativos</div>
      <div class="metric-value">${typeof totalLeads === 'number' ? totalLeads : totalLeads}</div>
      <div class="metric-sub">Total no funil</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Pipeline</div>
      <div class="metric-value t-serif" style="font-size:1.5rem">${typeof pipelineVal === 'number' ? DS.cur(pipelineVal) : '—'}</div>
      <div class="metric-sub">Valor em negociação</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Taxa de Conversão</div>
      <div class="metric-value">${typeof convRate === 'number' ? convRate.toFixed(1) + '%' : '—'}</div>
      <div class="metric-sub">Lead → Reserva</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Reservas Confirmadas</div>
      <div class="metric-value t-ok">${confirmedRes}</div>
      <div class="metric-sub">Este mês</div>
    </div>`;

  // Funnel
  const funnelPanel = document.getElementById('funnel-panel');
  const stages = funnel?.stages ?? funnel?.funnel ?? [];
  if (stages.length) {
    const maxCount = Math.max(...stages.map(s => s.count || 0), 1);
    funnelPanel.innerHTML = stages.map(s => {
      const pct = Math.round((s.count / maxCount) * 100);
      return `<div class="funnel-row">
        <div class="funnel-meta">
          <span class="funnel-stage">${DS.esc(s.stage || s.name || '')}</span>
          <span class="funnel-count">${s.count ?? 0}</span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill royal" style="width:${pct}%;background:var(--royal)"></div></div>
      </div>`;
    }).join('');
  } else {
    DS.emptyState(funnelPanel, 'Sem dados', 'Funil ainda sem registros.', '');
  }

  // Alerts
  const alertsPanel = document.getElementById('alerts-panel');
  const alertsData  = alertsRes.status === 'fulfilled' ? alertsRes.value : null;
  const alertList   = alertsData?.alerts ?? alertsData ?? [];
  if (alertList.length) {
    document.getElementById('alert-count').style.display = '';
    document.getElementById('alert-count').textContent = alertList.length;
    alertsPanel.innerHTML = alertList.slice(0,5).map(a => `
      <div class="alert-strip ${a.severity || 'medium'}" style="margin:var(--sp-2) var(--sp-4);border-radius:var(--r-md)">
        <span>${DS.alertIcon(a.severity)}</span>
        <span>${DS.esc(a.message || a.title || '')}</span>
      </div>`).join('');
  } else {
    DS.emptyState(alertsPanel, 'Sem alertas', 'Tudo certo por enquanto.', '');
  }

  // Leads table
  const leadsTable = document.getElementById('leads-table');
  const leadList   = leads?.leads ?? leads?.data ?? (Array.isArray(leads) ? leads : []);
  if (leadList.length) {
    leadsTable.innerHTML = `<div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th>Nome</th><th>Telefone</th><th>Score</th><th>Último contato</th>
      </tr></thead>
      <tbody>
        ${leadList.map(l => `<tr>
          <td><div class="row" style="gap:var(--sp-2)">
            <div class="avatar avatar-sm">${DS.initials(l.name || l.nome)}</div>
            <span>${DS.esc(l.name || l.nome || '—')}</span>
          </div></td>
          <td class="td-mono td-muted">${DS.esc(l.phone || l.telefone || '—')}</td>
          <td>${DS.scoreBadge(l.score_label || l.score || l.scoreLabel)}</td>
          <td class="td-muted">${DS.rel(l.last_message_at || l.lastMessageAt || l.updated_at)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
  } else {
    DS.emptyState(leadsTable, 'Nenhum lead', 'Leads aparecerão quando chegarem mensagens.', `<a href="leads.html" class="btn btn-secondary btn-sm">Ver leads</a>`);
  }
})();
</script>
</body>
</html>
