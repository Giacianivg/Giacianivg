  <style>
    /* ── Split-pane layout ── */
    html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; }
    .app-shell { height: 100vh; }
    .main-content { height: 100vh; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .page-body { flex: 1; min-height: 0; display: flex; overflow: hidden; padding: 0 !important; }

    /* ── Leads list pane ── */
    #leads-pane {
      width: 340px;
      min-width: 280px;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--bdr);
      background: var(--sur1);
      overflow: hidden;
    }
    #leads-search-bar {
      padding: var(--sp-2) var(--sp-3);
      border-bottom: 1px solid var(--bdr);
      background: var(--sur2);
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
    }
    #leads-list {
      flex: 1;
      overflow-y: auto;
    }
    .lead-item {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-3);
      cursor: pointer;
      border-bottom: 1px solid var(--bdr0);
      transition: background .12s;
    }
    .lead-item:hover { background: var(--sur2); }
    .lead-item.active { background: rgba(var(--royal-r,59,130,246),.10); border-right: 3px solid var(--royal-l); }
    .lead-item-info { flex: 1; min-width: 0; }
    .lead-item-name { font-size: .875rem; font-weight: 600; color: var(--tx1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lead-item-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
    .lead-item-phone { font-size: .72rem; color: var(--tx3); font-family: monospace; }
    .lead-item-time { font-size: .68rem; color: var(--tx3); }

    /* ── Chat pane ── */
    #chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }
    #chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--tx3);
      gap: var(--sp-2);
    }
    #chat-empty svg { opacity: .3; }
    #chat-header {
      padding: var(--sp-2) var(--sp-3);
      background: var(--sur1);
      border-bottom: 1px solid var(--bdr);
      display: none;
      align-items: center;
      gap: var(--sp-2);
      flex-shrink: 0;
    }
    #chat-header.show { display: flex; }
    #chat-header-info { flex: 1; min-width: 0; }
    #chat-header-name { font-size: .9375rem; font-weight: 700; color: var(--tx1); }
    #chat-header-sub { font-size: .75rem; color: var(--tx3); margin-top: 1px; }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .msg-row { display: flex; flex-direction: column; }
    .msg-row.guest { align-items: flex-start; }
    .msg-row.luna, .msg-row.team { align-items: flex-end; }
    .msg-bubble {
      max-width: 72%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: .8438rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg-bubble.guest { background: var(--sur2); color: var(--tx1); border-bottom-left-radius: 3px; }
    .msg-bubble.luna  { background: rgba(59,130,246,.18); color: var(--tx1); border-bottom-right-radius: 3px; }
    .msg-bubble.team  { background: rgba(34,197,94,.15); color: var(--tx1); border-bottom-right-radius: 3px; }
    .msg-role { font-size: .62rem; color: var(--tx3); margin-top: 2px; padding: 0 4px; }
    .msg-row.guest .msg-role { text-align: left; }
    .msg-row.luna .msg-role, .msg-row.team .msg-role { text-align: right; }
    #chat-polling-indicator {
      display: none;
      padding: 4px var(--sp-3);
      font-size: .7rem;
      color: var(--tx3);
      background: var(--sur1);
      border-top: 1px solid var(--bdr0);
      flex-shrink: 0;
    }
    #chat-polling-indicator.show { display: block; }
  </style>

            <select class="select" id="score-filter" style="width:auto;font-size:.75rem;padding:3px 6px">

<script src="design-system/u.js"></script>
<script>
const PAGE_SIZE = 50;
let allLeads = [], filtered = [], activeLead = null, pollTimer = null;

// ── Renderiza lista de leads (estilo WhatsApp) ──────────────────────────────
function renderList(data) {
  const cont = document.getElementById('leads-list');
  if (!data.length) {
    cont.innerHTML = '<div style="padding:var(--sp-4);text-align:center;color:var(--tx3);font-size:.8125rem">Nenhum lead encontrado</div>';
    return;
  }
  cont.innerHTML = data.slice(0, PAGE_SIZE).map(l => {
    const name  = l.name || l.nome || '—';
    const phone = l.phone || l.telefone || '';
    const score = l.score_label || l.score || '';
    const ts    = l.last_message_at || l.updated_at || '';
    const isActive = activeLead && (activeLead.id === l.id);
    return `<div class="lead-item${isActive ? ' active' : ''}" onclick="selectLead(${JSON.stringify(l).replace(/"/g,'&quot;')})">
      <div class="avatar avatar-sm">${DS.initials(name)}</div>
      <div class="lead-item-info">
        <div class="lead-item-name">${DS.esc(name)}</div>
        <div class="lead-item-meta">
          <span class="lead-item-phone">${DS.esc(phone)}</span>
          <span class="lead-item-time">${DS.rel(ts)}</span>
        </div>
      </div>
      <div style="flex-shrink:0">${DS.scoreBadge(score)}</div>
    </div>`;
  }).join('');
}

// ── Filtro ──────────────────────────────────────────────────────────────────
function applyFilter() {
  const q = document.getElementById('search').value.toLowerCase();
  const s = document.getElementById('score-filter').value;
  filtered = allLeads.filter(l => {
    const name  = (l.name || l.nome || '').toLowerCase();
    const phone = (l.phone || l.telefone || '').toLowerCase();
    const score = l.score_label || l.score || '';
    return (!q || name.includes(q) || phone.includes(q)) && (!s || score === s);
  });
  document.getElementById('leads-count').textContent = filtered.length + ' leads';
  renderList(filtered);
}

// ── Abre conversa do lead selecionado ───────────────────────────────────────
async function selectLead(lead) {
  activeLead = lead;
  applyFilter(); // re-render list to mark active

  const name  = lead.name || lead.nome || 'Lead';
  const phone = lead.phone || lead.telefone || '';
  const score = lead.score_label || lead.score || '';

  // Header
  document.getElementById('chat-avatar').textContent = DS.initials(name);
  document.getElementById('chat-header-name').textContent = name;
  document.getElementById('chat-header-sub').textContent = phone;
  document.getElementById('chat-header-badge').innerHTML = DS.scoreBadge(score);
  document.getElementById('chat-header').classList.add('show');
  document.getElementById('chat-empty').style.display = 'none';
  document.getElementById('chat-messages').style.display = 'flex';
  document.getElementById('chat-polling-indicator').classList.add('show');

  // Cancela poll anterior
  if (pollTimer) clearInterval(pollTimer);

  const leadId = lead.id || lead.lead_id || null;
  await loadMessages(phone, leadId);
  pollTimer = setInterval(() => loadMessages(phone, leadId), 5000);
}

async function loadMessages(phone, leadId) {
  if (!leadId && !phone) return;
  try {
    const param = leadId
      ? `lead_id=${encodeURIComponent(leadId)}`
      : `phone=${encodeURIComponent(phone)}`;
    const res = await DS.api(`/api/conversations?${param}&limit=50`);
    const msgs = res?.messages || res?.conversations || (Array.isArray(res) ? res : []);
    renderMessages(msgs);
  } catch {}
}

function renderMessages(msgs) {
  const cont = document.getElementById('chat-messages');
  if (!msgs.length) {
    cont.innerHTML = '<div style="text-align:center;color:var(--tx3);font-size:.8125rem;padding:var(--sp-4)">Sem mensagens ainda</div>';
    return;
  }
  const sorted = [...msgs].sort((a, b) => new Date(a.created_at || a.timestamp || 0) - new Date(b.created_at || b.timestamp || 0));
  cont.innerHTML = sorted.map(m => {
    const role = m.role === 'assistant' || m.role === 'luna' ? 'luna'
               : m.role === 'equipe' || m.role === 'team'   ? 'team'
               : 'guest';
    const roleLabel = role === 'luna' ? 'Luna' : role === 'team' ? 'Equipe' : 'Hóspede';
    return `<div class="msg-row ${role}">
      <div class="msg-bubble ${role}">${DS.esc(m.content || m.message || '')}</div>
      <div class="msg-role">${roleLabel} · ${DS.datetime(m.created_at || m.timestamp)}</div>
    </div>`;
  }).join('');
  // Auto-scroll para o final
  cont.scrollTop = cont.scrollHeight;
}

// ── Init ────────────────────────────────────────────────────────────────────
(async () => {
  const session = await DS.requireAuth();
  if (!session) return;
  DS.initNav();

  const avEl = document.getElementById('user-avatar');
  if (avEl) avEl.textContent = (session.user.email || '').slice(0,2).toUpperCase();

  try {
    const res = await DS.api('/api/leads?limit=500');
    allLeads = res?.leads || res?.data || (Array.isArray(res) ? res : []);
    filtered = [...allLeads];
    document.getElementById('leads-count').textContent = filtered.length + ' leads';
    renderList(filtered);
  } catch (err) {
    document.getElementById('leads-list').innerHTML = `<div style="padding:var(--sp-4);color:var(--err);font-size:.8125rem">${DS.esc(err.message)}</div>`;
  }

  document.getElementById('search').addEventListener('input', applyFilter);
  document.getElementById('score-filter').addEventListener('change', applyFilter);
})();
</script>
