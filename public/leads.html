  <!-- Main -->
  <main class="flex-1 overflow-auto">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold text-white">Leads</h1>
      <div class="flex items-center gap-3">
        <!-- Search -->
        <input type="text" id="searchInput" placeholder="Buscar por nome ou telefone..."
          class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 w-64">
        <!-- Status filter -->
        <select id="statusFilter" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
          <option value="">Todos status</option>
          <option value="new">Novos</option>
          <option value="qualified">Qualificados</option>
          <option value="proposal">Com proposta</option>
          <option value="negotiation">Em negociação</option>
          <option value="confirmed">Confirmados</option>
          <option value="lost">Perdidos</option>
        </select>
      </div>
    </header>

    <div class="p-6">
      <!-- Table -->
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <table class="w-full">
          <thead>
            <tr class="border-b border-slate-700">
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Lead</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">WhatsApp</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Status</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Score</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Conversas</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Alerta</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Última atividade</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Ações</th>
            </tr>
          </thead>
          <tbody id="leadsTable" class="divide-y divide-slate-700">
            <tr><td colspan="8" class="px-5 py-8 text-center text-slate-500">Carregando...</td></tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="px-5 py-3 border-t border-slate-700 flex items-center justify-between text-sm text-slate-400">
          <span id="paginationInfo"></span>
          <div class="flex gap-2">
            <button id="prevBtn" class="px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed">← Anterior</button>
            <button id="nextBtn" class="px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed">Próximo →</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Lead detail modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 rounded-2xl border border-slate-700 w-full max-w-2xl max-h-[80vh] overflow-auto">
      <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between">
        <h2 class="font-semibold text-white" id="modalTitle">Lead</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-6" id="modalBody">
        <div class="text-slate-500 text-sm">Carregando...</div>
      </div>
    </div>
  </div>

  <!-- Conversation viewer modal -->
  <div id="chatModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 rounded-2xl border border-slate-700 w-full max-w-3xl max-h-[80vh] flex flex-col">
      <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between shrink-0">
        <h2 class="font-semibold text-white" id="chatModalTitle">Conversa com Luna</h2>
        <button onclick="closeChatModal()" class="text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex-1 overflow-auto p-6 space-y-3" id="chatModalBody">
        <div class="text-slate-500 text-sm text-center py-8">Carregando mensagens...</div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    let allLeads = [];
    let allAlerts = {};   // Map lead_id → alert object
    const scoreCache = new Map(); // lead_id → label string
    let page = 0;
    const PAGE_SIZE = 20;

    function scoreBadge(label) {
      const map = {
        HOT:  { emoji: '🔥', cls: 'bg-red-900/30 text-red-400' },
        WARM: { emoji: '🟡', cls: 'bg-amber-900/30 text-amber-400' },
        COOL: { emoji: '🟠', cls: 'bg-orange-900/30 text-orange-400' },
        COLD: { emoji: '❄️', cls: 'bg-slate-700 text-slate-400' },
      };
      const s = map[label];
      if (!s) return '<span class="text-slate-500 text-xs">—</span>';
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${s.cls}">${s.emoji} ${label}</span>`;
    }

    async function dismissAlert(leadId) {
      const res = await api(`/alerts/${leadId}/dismiss`, { method: 'POST' });
      if (res.ok) {
        delete allAlerts[leadId];
        renderTable();
        toast('Alerta dispensado');
      } else {
        toast('Erro ao dispensar alerta', 'error');
      }
    }

    async function loadAlerts() {
      const res = await api('/alerts/active');
      if (!res.ok) return;
      allAlerts = {};
      for (const a of res.data.alerts || []) {
        allAlerts[a.lead_id] = a;
      }
    }

    async function loadScores(leads) {
      if (!leads.length) return;
      const BATCH = 5;
      for (let i = 0; i < leads.length; i += BATCH) {
        const batch = leads.slice(i, i + BATCH);
        await Promise.allSettled(batch.map(async lead => {
          if (scoreCache.has(lead.id)) {
            const el = document.getElementById(`score-${lead.id}`);
            if (el) el.innerHTML = scoreBadge(scoreCache.get(lead.id));
            return;
          }
          try {
            const res = await api(`/leads/${lead.id}/score`);
            if (res.ok && res.data.label) {
              scoreCache.set(lead.id, res.data.label);
              const el = document.getElementById(`score-${lead.id}`);
              if (el) el.innerHTML = scoreBadge(res.data.label);
            }
          } catch {}
        }));
      }
    }

    async function init() {
      await requireAuth();
      loadLeads();

      document.getElementById('searchInput').addEventListener('input', renderTable);
      document.getElementById('statusFilter').addEventListener('change', () => { page = 0; renderTable(); });
      document.getElementById('prevBtn').addEventListener('click', () => { if (page > 0) { page--; renderTable(); } });
      document.getElementById('nextBtn').addEventListener('click', () => { page++; renderTable(); });
      document.getElementById('logoutBtn').addEventListener('click', logout);
    }

    async function loadLeads() {
      const [leadsRes] = await Promise.allSettled([
        api('/leads?limit=200'),
        loadAlerts(),
      ]);
      if (leadsRes.status !== 'fulfilled' || !leadsRes.value.ok) {
        document.getElementById('leadsTable').innerHTML =
          '<tr><td colspan="8" class="px-5 py-8 text-center text-amber-400">Banco de dados não configurado. Execute as migrations no Supabase.</td></tr>';
        return;
      }
      allLeads = leadsRes.value.data.leads || [];
      renderTable();
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      let filtered = allLeads.filter(l => {
        const matchSearch = !search ||
          (l.name || '').toLowerCase().includes(search) ||
          (l.whatsapp_number || '').includes(search);
        const matchStatus = !status || l.funnel_stage === status;
        return matchSearch && matchStatus;
      });

      const total = filtered.length;
      const paginated = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

      document.getElementById('paginationInfo').textContent =
        `${total} lead${total !== 1 ? 's' : ''} · página ${page + 1} de ${Math.ceil(total / PAGE_SIZE) || 1}`;

      document.getElementById('prevBtn').disabled = page === 0;
      document.getElementById('nextBtn').disabled = (page + 1) * PAGE_SIZE >= total;

      if (!paginated.length) {
        document.getElementById('leadsTable').innerHTML =
          '<tr><td colspan="8" class="px-5 py-8 text-center text-slate-500">Nenhum lead encontrado</td></tr>';
        return;
      }

      document.getElementById('leadsTable').innerHTML = paginated.map(l => {
        const alert = allAlerts[l.id];
        const alertCell = alert
          ? `<div class="flex items-center gap-2">
               <span class="text-xs text-slate-300 max-w-[110px] truncate" title="${(alert.alert_message || '').replace(/"/g, '&quot;')}">${alert.alert_message || '—'}</span>
               <button onclick="dismissAlert('${l.id}')" class="shrink-0 text-xs text-red-400 hover:text-red-300 transition-colors">Dispensar</button>
             </div>`
          : '<span class="text-slate-500 text-xs">—</span>';
        return `
        <tr class="hover:bg-slate-700/40 transition-colors">
          <td class="px-5 py-3">
            <p class="font-medium text-white text-sm">${l.name || '<span class="text-slate-500">Sem nome</span>'}</p>
            <p class="text-xs text-slate-500">${l.id.slice(0, 8)}...</p>
          </td>
          <td class="px-5 py-3 text-sm text-slate-300">${l.whatsapp_number}</td>
          <td class="px-5 py-3">${statusBadge(l.funnel_stage)}</td>
          <td class="px-5 py-3" id="score-${l.id}"><span class="text-slate-500 text-xs">…</span></td>
          <td class="px-5 py-3">
            ${l.conversation_count ? `<button onclick="viewConversations('${l.id}', '${l.name || l.whatsapp_number}')" class="inline-flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs text-slate-300 hover:text-white hover:bg-slate-700/50 transition-colors" title="Ver conversa">
              <span class="text-sm">${l.conversation_count}</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </button>` : '<span class="text-slate-500">—</span>'}
          </td>
          <td class="px-5 py-3">${alertCell}</td>
          <td class="px-5 py-3 text-sm text-slate-400">${relativeTime(l.updated_at)}</td>
          <td class="px-5 py-3">
            <button onclick="viewLead('${l.id}')" class="text-xs text-purple-400 hover:text-purple-300 transition-colors">Ver →</button>
          </td>
        </tr>`;
      }).join('');

      // Load scores asynchronously after table is rendered
      loadScores(paginated);
    }

    async function viewLead(id) {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = 'Carregando...';
      document.getElementById('modalBody').innerHTML = '<div class="text-slate-500 text-sm">Carregando...</div>';

      const lead = allLeads.find(l => l.id === id);
      if (!lead) return;

      document.getElementById('modalTitle').textContent = lead.name || lead.whatsapp_number;
      document.getElementById('modalBody').innerHTML = `
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-4 text-sm">
            <div><p class="text-slate-400 mb-0.5">WhatsApp</p><p class="text-white font-mono">${lead.whatsapp_number}</p></div>
            <div><p class="text-slate-400 mb-0.5">Funil</p>${statusBadge(lead.funnel_stage)}</div>
            <div><p class="text-slate-400 mb-0.5">Criado em</p><p class="text-white">${formatDatetime(lead.created_at)}</p></div>
            <div><p class="text-slate-400 mb-0.5">Atualizado</p><p class="text-white">${relativeTime(lead.updated_at)}</p></div>
          </div>

          <!-- Status update -->
          <div class="border-t border-slate-700 pt-4">
            <p class="text-sm font-medium text-slate-300 mb-2">Atualizar status</p>
            <div class="flex gap-2 flex-wrap">
              ${['new','qualified','proposal','negotiation','confirmed','lost'].map(s =>
                `<button onclick="updateStatus('${lead.id}','${s}')" class="px-3 py-1.5 rounded-lg text-xs font-medium border ${lead.funnel_stage === s ? 'border-purple-500 text-purple-300 bg-purple-900/30' : 'border-slate-600 text-slate-400 hover:border-slate-500 hover:text-slate-200'} transition-colors">${STATUS_LABELS[s]?.label || s}</button>`
              ).join('')}
            </div>
          </div>
        </div>
      `;
    }

    async function updateStatus(leadId, status) {
      // Update in local array optimistically
      const lead = allLeads.find(l => l.id === leadId);
      if (lead) lead.funnel_stage = status;
      renderTable();
      closeModal();
      toast('Status atualizado (requer chamada API PATCH)');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function closeChatModal() {
      document.getElementById('chatModal').classList.add('hidden');
    }

    async function viewConversations(leadId, leadName) {
      document.getElementById('chatModal').classList.remove('hidden');
      document.getElementById('chatModalTitle').textContent = `Conversa: ${leadName}`;
      document.getElementById('chatModalBody').innerHTML = '<div class="text-slate-500 text-sm text-center py-8">Carregando mensagens...</div>';

      const res = await api(`/conversations?lead_id=${leadId}&limit=10000`);
      if (!res.ok || !res.data.conversations) {
        document.getElementById('chatModalBody').innerHTML = '<div class="text-red-400 text-sm text-center py-8">Erro ao carregar conversas</div>';
        return;
      }

      const conversations = res.data.conversations;

      console.log(`%c[viewConversations] ✅ Received ${conversations.length} messages for lead ${leadId}`, 'color: green; font-weight: bold');

      if (conversations.length > 0) {
        console.table(conversations.slice(-5).map(m => ({
          role: m.role,
          content: m.content.substring(0, 40) + '...',
          created_at: m.created_at,
          id: m.id.substring(0, 8) + '...',
        })));
      }

      if (!conversations.length) {
        document.getElementById('chatModalBody').innerHTML = '<div class="text-slate-500 text-sm text-center py-8">Nenhuma mensagem ainda</div>';
        return;
      }

      // Garantir ordem cronológica por timestamp + id (como tiebreaker para colisões)
      console.log('%c[viewConversations] Sorting by created_at ASC, then id ASC...', 'color: blue');
      conversations.sort((a, b) => {
        const timeA = new Date(a.created_at).getTime();
        const timeB = new Date(b.created_at).getTime();
        if (timeA !== timeB) return timeA - timeB;
        return a.id.localeCompare(b.id);
      });

      console.log(`%c[viewConversations] ✅ After sort: first=${conversations[0].role} at ${conversations[0].created_at}, last=${conversations[conversations.length - 1].role} at ${conversations[conversations.length - 1].created_at}`, 'color: green');

      document.getElementById('chatModalBody').innerHTML = conversations.map(msg => {
        const isUser = msg.role === 'user'; // true = Cliente, false = Luna
        // Cliente (cinza, esquerda) | Luna (roxo, direita)
        return `
          <div class="flex gap-2 ${isUser ? 'justify-start' : 'justify-end'} mb-2">
            <div class="flex flex-col ${isUser ? 'items-start' : 'items-end'} max-w-xs">
              <div class="${isUser
                ? 'bg-slate-600 text-white rounded-3xl rounded-tl-none'
                : 'bg-purple-600 text-white rounded-3xl rounded-tr-none'} px-4 py-2.5 text-sm leading-relaxed">
                ${escapeHtml(msg.content)}
              </div>
              <span class="text-xs text-slate-400 mt-1 px-2">${formatDatetime(msg.created_at)}</span>
            </div>
          </div>
        `;
      }).join('');

      // Auto-scroll para a última mensagem (como WhatsApp)
      const chatBody = document.getElementById('chatModalBody');
      setTimeout(() => {
        chatBody.scrollTop = chatBody.scrollHeight;
      }, 0);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    document.getElementById('chatModal').addEventListener('click', e => {
      if (e.target === document.getElementById('chatModal')) closeChatModal();
    });

    init();
  </script>
</body>
