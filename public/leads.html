<!-- Slide-over -->
<div id="lead-detail-backdrop" class="slideover-backdrop"></div>
<div class="slideover" id="lead-detail">
  <div class="slideover-header">
    <span class="slideover-title" id="detail-name">Detalhes do Lead</span>
    <button class="close-btn" onclick="DS.closeSlideOver('lead-detail')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="slideover-body">
    <div id="detail-content"><div class="skel skel-card" style="height:200px"></div></div>
    <div class="slideover-section" id="conv-section" style="display:none">
      <div class="slideover-section-title">Conversa</div>
      <div class="chat-list" id="chat-list"></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="design-system/u.js"></script>
<script>
const PAGE_SIZE = 20;
let allLeads = [], filtered = [], page = 1;

function renderTable(data) {
  const cont = document.getElementById('leads-table');
  if (!data.length) {
    DS.emptyState(cont, 'Nenhum lead', 'Não há leads com esse filtro.', '');
    return;
  }
  const start = (page - 1) * PAGE_SIZE;
  const slice = data.slice(start, start + PAGE_SIZE);
  cont.innerHTML = `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>
      <th>Nome</th><th>Telefone</th><th>Score</th><th>Último contato</th><th></th>
    </tr></thead>
    <tbody>
      ${slice.map(l => `<tr>
        <td><div class="row" style="gap:var(--sp-2)">
          <div class="avatar avatar-sm">${DS.initials(l.name || l.nome)}</div>
          <span>${DS.esc(l.name || l.nome || '—')}</span>
        </div></td>
        <td class="td-mono td-muted">${DS.esc(l.phone || l.telefone || '—')}</td>
        <td>${DS.scoreBadge(l.score_label || l.score_label || l.score)}</td>
        <td class="td-muted">${DS.rel(l.last_message_at || l.updated_at)}</td>
        <td class="td-action">
          <button class="btn btn-ghost btn-sm" onclick="openDetail(${JSON.stringify(l).replace(/"/g,'&quot;')})">Ver →</button>
        </td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;

  renderPagination(data.length);
}

function renderPagination(total) {
  const pages = Math.ceil(total / PAGE_SIZE);
  const wrap = document.getElementById('pagination-wrap');
  if (pages <= 1) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const pg = document.getElementById('pagination');
  pg.innerHTML = `
    <button class="page-btn" onclick="changePage(${page-1})" ${page===1?'disabled':''}>← Anterior</button>
    <span class="page-info">${page} / ${pages}</span>
    <button class="page-btn" onclick="changePage(${page+1})" ${page>=pages?'disabled':''}>Próxima →</button>`;
}

function changePage(p) { page = p; renderTable(filtered); }

function applyFilter() {
  const q = document.getElementById('search').value.toLowerCase();
  const s = document.getElementById('score-filter').value;
  filtered = allLeads.filter(l => {
    const name  = (l.name || l.nome || '').toLowerCase();
    const phone = (l.phone || l.telefone || '').toLowerCase();
    const score = l.score_label || l.score || '';
    return (!q || name.includes(q) || phone.includes(q)) && (!s || score === s);
  });
  page = 1;
  document.getElementById('leads-count').textContent = filtered.length + ' leads';
  renderTable(filtered);
}

async function openDetail(lead) {
  document.getElementById('detail-name').textContent = lead.name || lead.nome || 'Lead';
  DS.openSlideOver('lead-detail');
  document.getElementById('conv-section').style.display = 'none';

  const phone = lead.phone || lead.telefone || '';
  document.getElementById('detail-content').innerHTML = `
    <div class="slideover-section">
      <div class="detail-row"><span class="detail-key">Nome</span><span class="detail-val">${DS.esc(lead.name || lead.nome || '—')}</span></div>
      <div class="detail-row"><span class="detail-key">Telefone</span><span class="detail-val td-mono">${DS.esc(phone)}</span></div>
      <div class="detail-row"><span class="detail-key">Score</span><span class="detail-val">${DS.scoreBadge(lead.score_label || lead.score)}</span></div>
      <div class="detail-row"><span class="detail-key">Última msg</span><span class="detail-val">${DS.rel(lead.last_message_at || lead.updated_at)}</span></div>
      <div class="detail-row"><span class="detail-key">Criado em</span><span class="detail-val">${DS.date(lead.created_at)}</span></div>
    </div>`;

  if (phone) {
    try {
      const convRes = await DS.api(`/api/conversations?phone=${encodeURIComponent(phone)}&limit=30`);
      const msgs = convRes?.messages || convRes?.conversations || convRes || [];
      if (msgs.length) {
        const chatEl = document.getElementById('chat-list');
        chatEl.innerHTML = msgs.slice().reverse().map(m => {
          const cls = m.role === 'assistant' || m.role === 'luna' ? 'luna'
                    : m.role === 'equipe' || m.role === 'team' ? 'team'
                    : 'guest';
          return `<div><div class="chat-bubble ${cls}">${DS.esc(m.content || m.message || '')}</div>
            <div class="chat-ts">${DS.datetime(m.created_at || m.timestamp)}</div></div>`;
        }).join('');
        document.getElementById('conv-section').style.display = '';
      }
    } catch {}
  }
}

(async () => {
  const session = await DS.requireAuth();
  if (!session) return;
  DS.initNav();

  const avEl = document.getElementById('user-avatar');
  if (avEl) avEl.textContent = (session.user.email || '').slice(0,2).toUpperCase();

  try {
    const res = await DS.api('/api/leads?limit=500');
    allLeads = res?.leads || res?.data || (Array.isArray(res) ? res : []);
    filtered = [...allLeads];
    document.getElementById('leads-count').textContent = filtered.length + ' leads';
    renderTable(filtered);
  } catch (err) {
    DS.errorState('leads-table', err.message);
  }

  document.getElementById('search').addEventListener('input', applyFilter);
  document.getElementById('score-filter').addEventListener('change', applyFilter);
})();
</script>
