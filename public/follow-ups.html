  <!-- Main -->
  <main class="flex-1 overflow-auto">

      <div class="flex items-center gap-3">

        <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-sm font-bold text-white" id="userAvatar">?</div>
      </div>

    <div class="p-6">
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <table class="w-full">
          <thead>
            <tr class="border-b border-slate-700">
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Lead</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Tipo</th>

              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Status</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Ações</th>
            </tr>
          </thead>
          <tbody id="followUpsTable" class="divide-y divide-slate-700">

          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    const FOLLOW_UP_TYPE_LABELS = {
      first_contact:     'Primeiro contato',
      quote_followup:    'Acompanhar cotação',
      no_response:       'Sem resposta',
      post_stay:         'Pós-estadia',
      reengagement:      'Reengajamento',
    };

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      document.getElementById('userEmail').textContent = session.user.email;
      document.getElementById('userAvatar').textContent = session.user.email[0].toUpperCase();
      document.getElementById('logoutBtn').addEventListener('click', logout);
      loadFollowUps();
    }

    async function loadFollowUps() {
      const res = await api('/follow-ups/pending');
      const tbody = document.getElementById('followUpsTable');

      if (!res.ok) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-5 py-8 text-center text-amber-400">Erro ao carregar follow-ups</td></tr>';
        return;
      }

      const followUps = res.data.follow_ups || [];
      document.getElementById('followUpsCount').textContent =
        followUps.length ? `${followUps.length} pendente${followUps.length !== 1 ? 's' : ''}` : 'nenhum pendente';

      if (!followUps.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-5 py-8 text-center text-slate-500">Nenhum follow-up pendente</td></tr>';
        return;
      }

      tbody.innerHTML = followUps.map(f => {
        const leadName = f.lead_name || f.phone || f.lead_id?.slice(0, 8) + '...';
        const typeLabel = FOLLOW_UP_TYPE_LABELS[f.follow_up_type] || f.follow_up_type || '—';
        const scheduledFor = f.scheduled_for ? formatDatetime(f.scheduled_for) : '—';
        const isPast = f.scheduled_for && new Date(f.scheduled_for) < new Date();
        return `
          <tr class="hover:bg-slate-700/40 transition-colors" id="row-${f.id}">
            <td class="px-5 py-3">
              <p class="font-medium text-white text-sm">${leadName}</p>
              ${f.lead_funnel_stage ? `<p class="text-xs text-slate-500">${STATUS_LABELS[f.lead_funnel_stage]?.label || f.lead_funnel_stage}</p>` : ''}
            </td>
            <td class="px-5 py-3 text-sm text-slate-300">${typeLabel}</td>
            <td class="px-5 py-3">
              <span class="text-sm ${isPast ? 'text-amber-400' : 'text-slate-300'}">${scheduledFor}</span>
              ${isPast ? '<span class="ml-2 text-xs text-amber-500">atrasado</span>' : ''}
            </td>
            <td class="px-5 py-3">${statusBadge(f.status)}</td>
            <td class="px-5 py-3">
              <button onclick="cancelFollowUp('${f.id}')" class="text-xs text-red-400 hover:text-red-300 transition-colors">Cancelar</button>
            </td>
          </tr>`;
      }).join('');
    }

    async function cancelFollowUp(id) {
      const res = await api(`/follow-ups/${id}/cancel`, { method: 'DELETE' });
      if (res.ok) {
        const row = document.getElementById(`row-${id}`);
        if (row) row.remove();
        // Update count
        const tbody = document.getElementById('followUpsTable');
        const remaining = tbody.querySelectorAll('tr[id^="row-"]').length;
        document.getElementById('followUpsCount').textContent =
          remaining ? `${remaining} pendente${remaining !== 1 ? 's' : ''}` : 'nenhum pendente';
        if (!remaining) {
          tbody.innerHTML = '<tr><td colspan="5" class="px-5 py-8 text-center text-slate-500">Nenhum follow-up pendente</td></tr>';
        }
        toast('Follow-up cancelado');
      } else {
        toast('Erro ao cancelar follow-up', 'error');
      }
    }

    init();
  </script>
