<div id="toast-container"></div>

<script>
const FU_LABELS = {
  quote_followup: 'Follow-up de cotação',
  no_response:    'Sem resposta',
  post_stay:      'Pós-estadia',
  reengagement:   'Reengajamento',
  manual:         'Manual',
};

function renderGroup(title, list, badgeClass) {
  if (!list.length) return '';
  return `<div style="margin-bottom:var(--sp-6)">
    <div class="row-between" style="margin-bottom:var(--sp-3)">
      <h2 style="font-size:.9375rem;font-weight:600;color:var(--tx1)">${DS.esc(title)}</h2>
      <span class="badge ${badgeClass}">${list.length}</span>
    </div>
    <div class="panel">
      <div class="panel-body-flush">
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Hóspede</th><th>Tipo</th><th>Agendado para</th><th>Criado em</th><th></th></tr></thead>
          <tbody>${list.map(f => `<tr>
            <td><div class="row" style="gap:var(--sp-2)">
              <div class="avatar avatar-sm">${DS.initials(f.guest_name || f.guestName)}</div>
              <div>
                <div>${DS.esc(f.guest_name || f.guestName || f.phone || '—')}</div>
                <div class="t-3" style="font-size:.75rem">${DS.esc(f.phone || '')}</div>
              </div>
            </div></td>
            <td><span class="badge badge-sent">${DS.esc(FU_LABELS[f.type || f.follow_up_type] || f.type || '—')}</span></td>
            <td class="td-mono">${DS.datetime(f.scheduled_at || f.scheduledAt)}</td>
            <td class="td-muted">${DS.rel(f.created_at)}</td>
            <td class="td-action">
              <button class="btn btn-danger btn-sm" onclick="cancelFU('${DS.esc(f.id)}', this)">Cancelar</button>
            </td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>
  </div>`;
}

async function cancelFU(id, btn) {
  if (!confirm('Cancelar este follow-up?')) return;
  btn.disabled = true;
  try {
    await DS.api(`/api/follow-ups/${id}/cancel`, { method: 'DELETE' });
    DS.toast('Follow-up cancelado.', 'ok');
    btn.closest('tr').remove();
  } catch (err) {
    DS.toast(err.message, 'err');
    btn.disabled = false;
  }
}

(async () => {
  const session = await DS.requireAuth();
  if (!session) return;
  DS.initNav();
  const avEl = document.getElementById('user-avatar');
  if (avEl) avEl.textContent = (session.user.email || '').slice(0,2).toUpperCase();

  const el = document.getElementById('fu-content');
  try {
    const res = await DS.api('/api/follow-ups/pending');
    const all = res?.follow_ups || res?.followUps || res?.data || (Array.isArray(res) ? res : []);

    if (!all.length) { DS.emptyState(el, 'Nenhum follow-up pendente', 'Luna gerencia os follow-ups automaticamente.', ''); return; }

    const now = Date.now();
    const overdue  = all.filter(f => new Date(f.scheduled_at || f.scheduledAt).getTime() < now);
    const upcoming = all.filter(f => new Date(f.scheduled_at || f.scheduledAt).getTime() >= now);

    el.innerHTML =
      renderGroup('Vencidos', overdue, 'badge-hot') +
      renderGroup('Próximos', upcoming, 'badge-pending');
  } catch (err) {
    DS.errorState(el, err.message);
  }
})();
</script>
