<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sb-anon" content="sb_publishable_CJx8bk3hyNERd7FTDo-k1A_8nr5_iNs">
  <title>Login — Pousada Luz da Lua</title>
  <script>(function(){var t=localStorage.getItem('ldl-theme')||'dark';document.documentElement.setAttribute('data-theme',t)})()</script>
  <link rel="stylesheet" href="design-system/t.css">
  <link rel="stylesheet" href="design-system/c.css">
  <link rel="stylesheet" href="design-system/l.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <circle cx="28" cy="28" r="28" fill="var(--royal-bg)"/>
        <path d="M36 28a12 12 0 01-12 12 12 12 0 010-24 9 9 0 000 12z" fill="var(--royal-l)" opacity=".9"/>
        <circle cx="22" cy="18" r="2" fill="var(--gold)" opacity=".7"/>
        <circle cx="38" cy="22" r="1.5" fill="var(--gold)" opacity=".5"/>
      </svg>
      <div>
        <div class="auth-brand">Luz da Lua</div>
        <div class="auth-tagline">Painel de Operações</div>
      </div>
    </div>

    <form id="login-form">
      <div class="stack">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input class="input" type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input class="input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="err-msg" class="alert alert-err" style="display:none">
          <span class="alert-body">
            <span class="alert-title" id="err-text">Credenciais inválidas.</span>
          </span>
        </div>
        <button class="btn btn-primary" type="submit" id="submit-btn" style="width:100%;justify-content:center;margin-top:4px">
          Entrar
        </button>
      </div>
    </form>
  </div>
</div>

<div id="toast-container"></div>
<script src="design-system/u.js"></script>
<script>
(async () => {
  const sb = DS.getSB();
  if (sb) {
    const { data: { session } } = await sb.auth.getSession();
    if (session) { window.location.href = 'dashboard.html'; return; }
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errDiv = document.getElementById('err-msg');
    errDiv.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    try {
      const email = document.getElementById('email').value;
      const pass  = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      window.location.href = 'dashboard.html';
    } catch (err) {
      document.getElementById('err-text').textContent = err.message || 'Credenciais inválidas.';
      errDiv.style.display = 'flex';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
})();
</script>
</body>
</html>
