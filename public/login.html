<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sb-anon" content="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xeGVzanhicXVwbWhuaXZrZnlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MjAzODgsImV4cCI6MjA4OTA5NjM4OH0.MHAGQTNBNrDAPR3jCsPz8wftXriNrwCR6eyYbVemYDk">
  <title>Login — Pousada Luz da Lua</title>
  <script>(function(){var t=localStorage.getItem('ldl-theme')||'dark';document.documentElement.setAttribute('data-theme',t)})()</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="design-system/t.css">
  <link rel="stylesheet" href="design-system/c.css">
  <link rel="stylesheet" href="design-system/l.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" style="overflow:visible" aria-hidden="true">
        <defs><filter id="lunaGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3.5 6.6 6.6 0 0 0 21 12.8Z" fill="var(--gold)" opacity=".55" filter="url(#lunaGlow)"/>
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3.5 6.6 6.6 0 0 0 21 12.8Z" fill="var(--royal-l)"/>
      </svg>
      <div>
        <div class="auth-brand">Luz da Lua</div>
        <div class="auth-tagline">Painel de Operações</div>
      </div>
    </div>

    <form id="login-form">
      <div class="stack">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input class="input" type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input class="input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="err-msg" class="alert alert-err" style="display:none">
          <span class="alert-body">
            <span class="alert-title" id="err-text">Credenciais inválidas.</span>
          </span>
        </div>
        <button class="btn btn-primary" type="submit" id="submit-btn" style="width:100%;justify-content:center;margin-top:4px">
          Entrar
        </button>
      </div>
    </form>
  </div>
</div>

<div id="toast-container"></div>
<script src="design-system/u.js"></script>
<script>
(async () => {
  const sb = DS.getSB();
  if (sb) {
    const { data: { user }, error } = await sb.auth.getUser();
    if (user && !error) {
      const next = sessionStorage.getItem('ldl-return-to') || 'dashboard.html';
      sessionStorage.removeItem('ldl-return-to');
      window.location.href = next;
      return;
    }
    if (!user) await sb.auth.signOut(); // Clear any stale local session
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errDiv = document.getElementById('err-msg');
    errDiv.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    try {
      const email = document.getElementById('email').value;
      const pass  = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      const next = sessionStorage.getItem('ldl-return-to') || 'dashboard.html';
      sessionStorage.removeItem('ldl-return-to');
      window.location.href = next;
    } catch (err) {
      document.getElementById('err-text').textContent = err.message || 'Credenciais inválidas.';
      errDiv.style.display = 'flex';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
})();
</script>
</body>
</html>
