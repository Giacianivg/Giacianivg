<div id="toast-container"></div>
<script src="design-system/u.js"></script>
<script>
const WEEKDAY = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

let state = { settings: null, days: [], rooms: [] };

function fmtDateBR(iso) {
  const [y, m, d] = iso.split('-');
  const wd = WEEKDAY[new Date(`${iso}T00:00:00`).getDay()];
  return `${d}/${m} <span class="t-3" style="font-size:.7rem">${wd}</span>`;
}

function multBadge(d) {
  if (d.locked) return `<span class="badge badge-hot">🔒 ${fmtMult(d.multiplier)}</span>`;
  if (d.multiplier < 1) return `<span class="badge badge-ok">${fmtMult(d.multiplier)}</span>`;
  if (d.multiplier > 1) return `<span class="badge badge-pending">${fmtMult(d.multiplier)}</span>`;
  return `<span class="badge badge-muted">base</span>`;
}

function fmtMult(m) {
  const pct = Math.round((m - 1) * 100);
  return pct === 0 ? '0%' : (pct > 0 ? `+${pct}%` : `${pct}%`);
}

function renderSettings() {
  const s = state.settings;
  const isAuto = s.pricing_mode === 'auto';
  return `<div class="panel" style="margin-bottom:var(--sp-6)">
    <div class="panel-body">
      <div class="row-between" style="flex-wrap:wrap;gap:var(--sp-4)">
        <div class="row" style="gap:var(--sp-4);flex-wrap:wrap;align-items:flex-end">
          <div>
            <label class="t-3" style="display:block;font-size:.75rem;margin-bottom:4px">Piso por noite (R$)</label>
            <input class="input" id="set-floor" type="number" min="1" value="${s.price_floor}" style="width:110px">
          </div>
          <div>
            <label class="t-3" style="display:block;font-size:.75rem;margin-bottom:4px">Teto por noite (R$)</label>
            <input class="input" id="set-ceiling" type="number" min="1" value="${s.price_ceiling}" style="width:110px">
          </div>
          <div>
            <label class="t-3" style="display:block;font-size:.75rem;margin-bottom:4px">Meta ocupação (%)</label>
            <input class="input" id="set-target" type="number" min="1" max="100" value="${s.target_occupancy}" style="width:110px">
          </div>
          <button class="btn btn-primary btn-sm" onclick="saveSettings(this)">Salvar</button>
        </div>
        <div class="row" style="gap:var(--sp-3);align-items:center">
          <span class="badge ${isAuto ? 'badge-ok' : 'badge-muted'}">${isAuto ? 'Motor ATIVO' : 'Motor desligado'}</span>
          <button class="btn ${isAuto ? 'btn-danger' : 'btn-primary'} btn-sm" onclick="toggleMode(this)">
            ${isAuto ? 'Desativar motor' : 'Ativar motor'}
          </button>
        </div>
      </div>
      <p class="t-3" style="font-size:.75rem;margin-top:var(--sp-3)">
        Com o motor desligado, a Luna cota pela tabela normal. Ativado, cada noite recebe um ajuste
        automático por ritmo de vendas, antecedência e concorrência — sempre entre o piso e o teto.
        Clique em uma data do calendário para travar um multiplicador manual (sempre vence o automático).
      </p>
    </div>
  </div>`;
}

function renderCalendar() {
  if (!state.days.length) return '<p class="t-3">Calendário indisponível.</p>';
  return `<div class="panel" style="margin-bottom:var(--sp-6)">
    <div class="panel-body-flush"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Data</th><th>Ocupação</th><th>Ajuste</th><th>Faixa de preço</th><th>Por quê</th><th></th></tr></thead>
      <tbody>${state.days.map(d => `<tr>
        <td class="td-mono">${fmtDateBR(d.date)}</td>
        <td class="td-mono">${d.locked ? '—' : Math.round(d.factors.occupancyPct ?? 0) + '%'}</td>
        <td>${multBadge(d)}</td>
        <td class="td-mono">${d.price_example ? `R$ ${d.price_example.min}${d.price_example.max !== d.price_example.min ? ' – ' + d.price_example.max : ''}` : '—'}</td>
        <td class="t-3" style="font-size:.75rem;max-width:420px">${DS.esc(d.explanation || '')}</td>
        <td class="td-action">${d.locked
          ? `<button class="btn btn-ghost btn-sm" onclick="removeOverride('${d.date}', this)">Destravar</button>`
          : `<button class="btn btn-ghost btn-sm" onclick="setOverride('${d.date}')">Travar</button>`}</td>
      </tr>`).join('')}</tbody>
    </table></div></div>
  </div>`;
}

async function load() {
  const el = document.getElementById('pr-content');
  try {
    const res = await DS.api('/api/pricing/calendar?days=90');
    state.settings = res.settings;
    state.days = res.days || [];
    state.rooms = res.rooms || [];
    el.innerHTML = renderSettings() + renderCalendar();
  } catch (err) {
    DS.errorState(el, err.message);
  }
}

async function saveSettings(btn) {
  btn.disabled = true;
  try {
    await DS.api('/api/pricing/settings', {
      method: 'PUT',
      body: JSON.stringify({
        price_floor: Number(document.getElementById('set-floor').value),
        price_ceiling: Number(document.getElementById('set-ceiling').value),
        target_occupancy: Number(document.getElementById('set-target').value),
      }),
    });
    DS.toast('Configurações salvas.', 'ok');
    await load();
  } catch (err) {
    DS.toast(err.message, 'err');
    btn.disabled = false;
  }
}

async function toggleMode(btn) {
  const next = state.settings.pricing_mode === 'auto' ? 'off' : 'auto';
  const msg = next === 'auto'
    ? 'Ativar o motor? A Luna passa a aplicar os ajustes automáticos nas cotações.'
    : 'Desativar o motor? A Luna volta a cotar pela tabela normal.';
  if (!confirm(msg)) return;
  btn.disabled = true;
  try {
    await DS.api('/api/pricing/settings', {
      method: 'PUT',
      body: JSON.stringify({ pricing_mode: next }),
    });
    DS.toast(next === 'auto' ? 'Motor ativado.' : 'Motor desativado.', 'ok');
    await load();
  } catch (err) {
    DS.toast(err.message, 'err');
    btn.disabled = false;
  }
}

async function setOverride(date) {
  const raw = prompt(`Travar ${date} com qual ajuste? (% sobre o preço base, ex.: 20 para +20%, -10 para desconto)`);
  if (raw === null) return;
  const pct = Number(String(raw).replace(',', '.'));
  if (!Number.isFinite(pct) || pct <= -100 || pct > 200) {
    DS.toast('Valor inválido. Use um percentual entre -99 e 200.', 'err');
    return;
  }
  const note = prompt('Motivo (opcional):') || null;
  try {
    await DS.api(`/api/pricing/overrides/${date}`, {
      method: 'PUT',
      body: JSON.stringify({ multiplier: 1 + pct / 100, note }),
    });
    DS.toast(`Data ${date} travada.`, 'ok');
    await load();
  } catch (err) {
    DS.toast(err.message, 'err');
  }
}

async function removeOverride(date, btn) {
  if (!confirm(`Remover a trava manual de ${date}? A data volta ao cálculo automático.`)) return;
  btn.disabled = true;
  try {
    await DS.api(`/api/pricing/overrides/${date}`, { method: 'DELETE' });
    DS.toast('Trava removida.', 'ok');
    await load();
  } catch (err) {
    DS.toast(err.message, 'err');
    btn.disabled = false;
  }
}

(async () => {
  const session = await DS.requireAuth();
  if (!session) return;
  DS.initNav();
  const avEl = document.getElementById('user-avatar');
  if (avEl) avEl.textContent = (session.user.email || '').slice(0,2).toUpperCase();
  await load();
})();
</script>
