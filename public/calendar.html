<div id="toast-container"></div>
<script src="design-system/u.js"></script>
<script>
const ROOMS = ['ALA_A', 'ALA_B', 'ALA_C_CASAL', 'ALA_C_GRUPO'];
const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_PT   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

let curYear, curMonth;

function pad2(n) { return String(n).padStart(2,'0'); }
function isoDate(y,m,d) { return `${y}-${pad2(m+1)}-${pad2(d)}`; }

async function loadCalendar(year, month) {
  document.getElementById('month-label').textContent = MONTHS_PT[month] + ' ' + year;
  const cont = document.getElementById('cal-container');
  cont.innerHTML = '<div class="skel skel-card" style="height:240px"></div>';

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const from = isoDate(year, month, 1);
  const to   = isoDate(year, month, daysInMonth);
  const today = new Date().toISOString().slice(0,10);

  let calData = {};
  try {
    const res = await DS.api(`/api/availability/calendar?from=${from}&to=${to}`);
    const rows = res?.calendar || [];
    rows.forEach(row => { calData[row.date] = row.rooms || {}; });
  } catch (err) {
    DS.errorState(cont, err.message);
    return;
  }

  const days = Array.from({length: daysInMonth}, (_,i) => i+1);

  cont.style.setProperty('--cal-days', daysInMonth);

  // Header row
  let html = `<div class="cal-grid" style="--cal-days:${daysInMonth};min-width:${80 + daysInMonth*38}px">`;
  html += '<div class="cal-head-cell"></div>';
  days.forEach(d => {
    const dateStr = isoDate(year, month, d);
    const isToday = dateStr === today;
    const dayOfWeek = new Date(dateStr).getDay();
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
    html += `<div class="cal-head-cell" style="${isToday?'color:var(--gold);font-weight:700':''} ${isWeekend?'color:var(--royal-l)':''}">
      <div>${d}</div><div style="font-size:.6rem">${DAYS_PT[dayOfWeek]}</div>
    </div>`;
  });

  // Room rows
  ROOMS.forEach(roomKey => {
    html += `<div class="cal-room-label">${DS.esc(DS.room(roomKey))}</div>`;
    days.forEach(d => {
      const dateStr = isoDate(year, month, d);
      const roomData = (calData[dateStr] || {})[roomKey] || {};
      const status   = roomData.status || 'available';
      const isToday  = dateStr === today;
      const guest    = roomData.guest_name || roomData.guestName || '';
      const reason   = roomData.block_reason || roomData.blockReason || '';
      const tip      = guest || reason || status;
      html += `<div class="cal-cell ${status}${isToday?' today':''}" data-tip="${DS.esc(tip)}">
        ${guest ? `<div class="cal-guest">${DS.esc(guest.split(' ')[0])}</div>` : ''}
        ${reason ? `<div class="cal-guest t-err">${DS.esc(reason.slice(0,8))}</div>` : ''}
      </div>`;
    });
  });

  html += '</div>';
  cont.innerHTML = html;
}

(async () => {
  const session = await DS.requireAuth();
  if (!session) return;
  DS.initNav();
  const avEl = document.getElementById('user-avatar');
  if (avEl) avEl.textContent = (session.user.email || '').slice(0,2).toUpperCase();

  const now = new Date();
  curYear  = now.getFullYear();
  curMonth = now.getMonth();
  loadCalendar(curYear, curMonth);

  document.getElementById('prev-month').addEventListener('click', () => {
    curMonth--;
    if (curMonth < 0) { curMonth = 11; curYear--; }
    loadCalendar(curYear, curMonth);
  });
  document.getElementById('next-month').addEventListener('click', () => {
    curMonth++;
    if (curMonth > 11) { curMonth = 0; curYear++; }
    loadCalendar(curYear, curMonth);
  });
})();
</script>
