    </div>
    <nav class="flex-1 p-3 space-y-1">

        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Dashboard
      </a>
      <a href="leads.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Leads
      </a>
      <a href="reservations.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm bg-slate-700 text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Reservas
      </a>
      <a href="proposals.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Propostas

    <div class="p-3 border-t border-slate-700">
      <button id="logoutBtn" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-red-400 hover:bg-red-900/20 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-auto">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold text-white">Reservas</h1>
      <div class="flex items-center gap-3">
        <select id="statusFilter" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
          <option value="">Todos status</option>
          <option value="pending">Pendentes</option>
          <option value="confirmed">Confirmadas</option>
          <option value="cancelled">Canceladas</option>
          <option value="completed">Concluídas</option>
        </select>
        <select id="roomFilter" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
          <option value="">Todos quartos</option>
          <option value="ALA_A">Ala A</option>
          <option value="ALA_B">Ala B</option>
          <option value="ALA_C_CASAL">Ala C Casal</option>
          <option value="ALA_C_GRUPO">Ala C Grupo</option>
        </select>
      </div>
    </header>

    <div class="p-6 space-y-4">

      <!-- Summary cards -->
      <div class="grid grid-cols-4 gap-4">
        <div class="bg-slate-800 rounded-lg p-4 border border-slate-700 text-center">
          <p class="text-2xl font-bold text-white" id="totalCount">—</p>
          <p class="text-xs text-slate-400 mt-1">Total</p>
        </div>
        <div class="bg-slate-800 rounded-lg p-4 border border-slate-700 text-center">
          <p class="text-2xl font-bold text-yellow-400" id="pendingCount">—</p>
          <p class="text-xs text-slate-400 mt-1">Pendentes</p>
        </div>
        <div class="bg-slate-800 rounded-lg p-4 border border-slate-700 text-center">
          <p class="text-2xl font-bold text-green-400" id="confirmedCount">—</p>
          <p class="text-xs text-slate-400 mt-1">Confirmadas</p>
        </div>
        <div class="bg-slate-800 rounded-lg p-4 border border-slate-700 text-center">
          <p class="text-2xl font-bold text-purple-400" id="totalRevenue">—</p>
          <p class="text-xs text-slate-400 mt-1">Receita</p>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <table class="w-full">
          <thead>
            <tr class="border-b border-slate-700">
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Nº Reserva</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Hóspede</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Quarto</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Check-in</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Check-out</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Valor</th>
              <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Status</th>
            </tr>
          </thead>
          <tbody id="reservationsTable" class="divide-y divide-slate-700">
            <tr><td colspan="7" class="px-5 py-8 text-center text-slate-500">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/public/app.js"></script>
  <script>
    let allReservations = [];

    async function init() {
      await requireAuth();
      document.getElementById('logoutBtn').addEventListener('click', logout);
      document.getElementById('statusFilter').addEventListener('change', renderTable);
      document.getElementById('roomFilter').addEventListener('change', renderTable);
      loadReservations();
    }

    async function loadReservations() {
      const res = await api('/reservations?limit=200');
      if (!res.ok) {
        document.getElementById('reservationsTable').innerHTML =
          '<tr><td colspan="7" class="px-5 py-8 text-center text-amber-400">Banco de dados não configurado. Execute as migrations no Supabase.</td></tr>';
        return;
      }
      allReservations = res.data.reservations || [];
      updateSummary();
      renderTable();
    }

    function updateSummary() {
      const total    = allReservations.length;
      const pending  = allReservations.filter(r => r.status === 'pending').length;
      const confirmed = allReservations.filter(r => r.status === 'confirmed').length;
      const revenue  = allReservations
        .filter(r => r.status === 'confirmed')
        .reduce((s, r) => s + Number(r.total_amount || 0), 0);

      document.getElementById('totalCount').textContent     = total;
      document.getElementById('pendingCount').textContent   = pending;
      document.getElementById('confirmedCount').textContent = confirmed;
      document.getElementById('totalRevenue').textContent   = formatCurrency(revenue);
    }

    function renderTable() {
      const status   = document.getElementById('statusFilter').value;
      const roomType = document.getElementById('roomFilter').value;

      let filtered = allReservations.filter(r => {
        return (!status || r.status === status) && (!roomType || r.room_type === roomType);
      });

      if (!filtered.length) {
        document.getElementById('reservationsTable').innerHTML =
          '<tr><td colspan="7" class="px-5 py-8 text-center text-slate-500">Nenhuma reserva encontrada</td></tr>';
        return;
      }

      document.getElementById('reservationsTable').innerHTML = filtered.map(r => {
        const isCheckinSoon = new Date(r.checkin_date) <= new Date(Date.now() + 3 * 86400000) && r.status === 'confirmed';
        return `
          <tr class="hover:bg-slate-700/40 transition-colors ${isCheckinSoon ? 'border-l-2 border-purple-500' : ''}">
            <td class="px-5 py-3 text-sm font-mono text-purple-300">${r.reservation_number || '—'}</td>
            <td class="px-5 py-3">
              <p class="text-sm font-medium text-white">${r.leads?.name || 'Sem nome'}</p>
              <p class="text-xs text-slate-400">${r.leads?.whatsapp_number || ''}</p>
            </td>
            <td class="px-5 py-3 text-sm text-slate-300">${roomLabel(r.room_type)}</td>
            <td class="px-5 py-3 text-sm text-white">${formatDate(r.checkin_date)}</td>
            <td class="px-5 py-3 text-sm text-slate-300">${formatDate(r.checkout_date)}</td>
            <td class="px-5 py-3 text-sm text-white font-medium">${formatCurrency(r.total_amount)}</td>
            <td class="px-5 py-3">${statusBadge(r.status)}</td>
          </tr>
        `;
      }).join('');
    }

    init();
  </script>
</body>
</html>
