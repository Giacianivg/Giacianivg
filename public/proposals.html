<div id="toast-container"></div>
<script src="design-system/u.js"></script>
<script>
let allProps = [], filtered = [];

function renderGrid(list) {
  const el = document.getElementById('proposals-grid');
  document.getElementById('prop-count').textContent = list.length + ' propostas';
  if (!list.length) { DS.emptyState(el, 'Nenhuma proposta', 'Propostas aparecem quando Luna cota automaticamente.', ''); return; }
  el.innerHTML = list.map(p => {
    const nights = p.nights || p.num_nights || '';
    const room   = DS.room(p.room_type || p.roomType || p.accommodation);
    const checkin = DS.date(p.check_in || p.checkIn);
    const checkout = DS.date(p.check_out || p.checkOut);
    const countdown = (p.expires_at || p.expiresAt) ? DS.countdownBadge(p.expires_at || p.expiresAt) : '';
    return `<div class="proposal-card">
      <div class="row-between">
        <div>
          <div class="prop-value">${DS.cur(p.total_amount || p.totalAmount || p.total)}</div>
          <div class="prop-meta">${nights ? nights + ' noite' + (nights > 1 ? 's' : '') + ' · ' : ''}${DS.esc(room)}</div>
        </div>
        ${DS.statusBadge(p.status)}
      </div>
      <div class="prop-meta t-2">${DS.esc(p.guest_name || p.guestName || '—')}</div>
      <div class="prop-meta">${checkin} → ${checkout}</div>
      ${countdown ? `<div>${countdown}</div>` : ''}
      <div class="prop-actions">
        <span class="t-3" style="font-size:.75rem">${DS.rel(p.created_at)}</span>
      </div>
    </div>`;
  }).join('');
}

(async () => {
  const session = await DS.requireAuth();
  if (!session) return;
  DS.initNav();
  const avEl = document.getElementById('user-avatar');
  if (avEl) avEl.textContent = (session.user.email || '').slice(0,2).toUpperCase();

  try {
    const res = await DS.api('/api/proposals');
    allProps = res?.proposals || res?.data || (Array.isArray(res) ? res : []);
    filtered = [...allProps];
    renderGrid(filtered);
  } catch (err) {
    DS.errorState('proposals-grid', err.message);
  }

  document.getElementById('status-filter').addEventListener('change', (e) => {
    const v = e.target.value;
    filtered = v ? allProps.filter(p => p.status === v) : [...allProps];
    renderGrid(filtered);
  });
})();
</script>
