  <style>
    /* ── Map container ── */
    .map-wrap {
      background: var(--sur1);
      border: 1px solid var(--bdr1);
      border-radius: var(--r-lg);
      padding: var(--sp-4);
      overflow: hidden;
    }
    .map-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--sp-4);
      flex-wrap: wrap;
      gap: var(--sp-2);
    }
    .map-title { font-size: .9375rem; font-weight: 700; color: var(--tx1); }
    .map-updated { font-size: .75rem; color: var(--tx3); }

    /* ── Legend ── */
    .legend {
      display: flex;
      gap: var(--sp-4);
      flex-wrap: wrap;
      margin-bottom: var(--sp-4);
      padding: var(--sp-2) var(--sp-3);
      background: var(--sur2);
      border-radius: var(--r-md);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--sp-1);
      font-size: .75rem;
      color: var(--tx2);
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 3px;
      border: 2px solid;
      flex-shrink: 0;
    }
    .ld-available { background: rgba(34,197,94,.2);  border-color: #22c55e; }
    .ld-occupied  { background: rgba(239,68,68,.2);  border-color: #ef4444; }
    .ld-checkin   { background: rgba(234,179,8,.2);  border-color: #eab308; }
    .ld-request   { background: rgba(99,102,241,.2); border-color: #6366f1; }
    .ld-unknown   { background: rgba(148,163,184,.1);border-color: #94a3b8; }

    /* ── SVG floor plan ── */
    .floor-svg {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: block;
      cursor: default;
    }

    /* Room base styles */
    .room-area {
      transition: fill .4s ease, stroke .4s ease;
      cursor: pointer;
    }
    .room-label {
      font-family: var(--f-sans, system-ui, sans-serif);
      pointer-events: none;
      user-select: none;
    }

    /* Status fills */
    .s-available { fill: rgba(34,197,94,.15);  stroke: #22c55e; stroke-width: 2; }
    .s-occupied  { fill: rgba(239,68,68,.18);  stroke: #ef4444; stroke-width: 2; }
    .s-checkin   { fill: rgba(234,179,8,.2);   stroke: #eab308; stroke-width: 2.5; }
    .s-request   { fill: rgba(99,102,241,.15); stroke: #6366f1; stroke-width: 1.5; stroke-dasharray: 6,3; }
    .s-unknown   { fill: rgba(148,163,184,.08);stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }

    /* Pulse animations */
    @keyframes pulse-occupied {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(239,68,68,0));  }
      50%       { filter: drop-shadow(0 0 8px rgba(239,68,68,.7)); }
    }
    @keyframes pulse-checkin {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(234,179,8,0));  }
      50%       { filter: drop-shadow(0 0 10px rgba(234,179,8,.8)); }
    }
    @keyframes pulse-available {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(34,197,94,0));  }
      50%       { filter: drop-shadow(0 0 5px rgba(34,197,94,.4)); }
    }

    .anim-occupied  { animation: pulse-occupied  2s ease-in-out infinite; }
    .anim-checkin   { animation: pulse-checkin   1.4s ease-in-out infinite; }
    .anim-available { animation: pulse-available 3s ease-in-out infinite; }

    /* ── Room detail panel ── */
    .room-detail {
      margin-top: var(--sp-4);
      background: var(--sur2);
      border: 1px solid var(--bdr1);
      border-radius: var(--r-md);
      padding: var(--sp-3) var(--sp-4);
      display: none;
      animation: fadeIn .2s ease;
    }
    .room-detail.show { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--sp-2);
    }
    .detail-name { font-size: .9375rem; font-weight: 700; color: var(--tx1); }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: var(--sp-3);
      margin-top: var(--sp-2);
    }
    .detail-stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--tx3); margin-bottom: 2px; }
    .detail-stat-value { font-size: .9375rem; font-weight: 700; color: var(--tx1); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .sb-available { background: rgba(34,197,94,.12);  color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
    .sb-occupied  { background: rgba(239,68,68,.12);  color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
    .sb-checkin   { background: rgba(234,179,8,.12);  color: #eab308; border: 1px solid rgba(234,179,8,.3); }
    .sb-request   { background: rgba(99,102,241,.12); color: #6366f1; border: 1px solid rgba(99,102,241,.3); }
    .sb-unknown   { background: rgba(148,163,184,.1); color: #94a3b8; border: 1px solid rgba(148,163,184,.3); }

    /* ── Refresh indicator ── */
    .refresh-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--ok);
      display: inline-block;
      margin-right: 4px;
      animation: pulse-available 2s ease-in-out infinite;
    }
    .refresh-dot.loading { background: var(--gold); animation: pulse-checkin 1s ease-in-out infinite; }
  </style>
</head>

            <circle cx="0" cy="0" r="18" fill="none" stroke="var(--tx3)" stroke-width="1"/>
            <polygon points="0,-14 3,-4 0,-2 -3,-4" fill="var(--err)"/>
            <polygon points="0,14 3,4 0,2 -3,4" fill="var(--tx3)"/>
            <polygon points="-14,0 -4,-3 -2,0 -4,3" fill="var(--tx3)"/>
            <polygon points="14,0 4,-3 2,0 4,3" fill="var(--tx3)"/>
            <text x="0" y="-20" text-anchor="middle" fill="var(--tx3)" font-size="9" font-family="system-ui">N</text>
          </g>

        </svg>

        <!-- Room detail panel -->
        <div class="room-detail" id="room-detail">
          <div class="detail-header">
            <span class="detail-name" id="detail-name">—</span>
            <span class="status-badge" id="detail-badge">—</span>
          </div>
          <div class="detail-grid" id="detail-grid"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="design-system/u.js"></script>
<script>
(function () {
  'use strict';

  const sbMeta = document.querySelector('meta[name="sb-anon"]');
  const SUPABASE_URL  = 'https://ywsyfnkbczsrgddbmbwh.supabase.co';
  const SUPABASE_ANON = sbMeta ? sbMeta.content.replace('sb_publishable_', '') : '';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  let authToken = null;

  // ── Auth ──────────────────────────────────────────────────────────────────
  sb.auth.getSession().then(({ data }) => {
    const user = data?.session?.user;
    if (!user) { window.location.href = '/login.html'; return; }
    const emailEl = document.querySelector('[data-user-email]');
    const avatarEl = document.getElementById('user-avatar');
    if (emailEl) emailEl.textContent = user.email;
    if (avatarEl) avatarEl.textContent = (user.email || '?')[0].toUpperCase();
    authToken = data.session.access_token;
    loadMap();
    // Auto-refresh every 60s
    setInterval(loadMap, 60_000);
  });

  document.querySelector('[data-action="logout"]')?.addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = '/login.html';
  });

  document.getElementById('btn-refresh').addEventListener('click', loadMap);

  async function apiFetch(path) {
    if (!authToken) { const { data } = await sb.auth.getSession(); authToken = data?.session?.access_token; }
    if (!authToken) { window.location.href = '/login.html'; return null; }
    const res = await fetch(path, { headers: { Authorization: `Bearer ${authToken}` } });
    if (res.status === 401) { window.location.href = '/login.html'; return null; }
    return res.json();
  }

  // ── State ─────────────────────────────────────────────────────────────────
  let roomsData   = {};   // code → room object
  let selectedCode = null;
  const TODAY = new Date().toISOString().slice(0, 10);

  // ── Load ──────────────────────────────────────────────────────────────────
  async function loadMap() {
    const dot = document.getElementById('refresh-dot');
    dot.classList.add('loading');
    document.getElementById('last-updated').textContent = 'Atualizando...';

    const [roomsRes, recentRes] = await Promise.all([
      apiFetch('/api/rooms'),
      apiFetch('/api/financial/recent?limit=50'),
    ]);

    // Which room_types have check-in today?
    const checkinToday = new Set();
    if (recentRes?.success) {
      for (const r of (recentRes.reservations || [])) {
        if (r.checkin_date === TODAY && ['confirmed', 'deposit_paid', 'checked_in'].includes(r.status)) {
          checkinToday.add(r.room_type); // e.g. "ALA_A", "ALA_C_1", "ALA_C_2"
        }
      }
    }

    if (roomsRes?.success) {
      for (const room of (roomsRes.rooms || [])) {
        roomsData[room.code] = room;
      }
      applyStatuses(checkinToday);
    }

    dot.classList.remove('loading');
    const now = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('last-updated').textContent = `Atualizado às ${now}`;

    // Refresh detail panel if a room is selected
    if (selectedCode) selectRoom(selectedCode);
  }

  // ── Apply status to SVG ───────────────────────────────────────────────────
  function applyStatuses(checkinToday) {
    // ALA_A
    const alaA = roomsData['ALA_A'];
    if (alaA) {
      const checkin = checkinToday.has('ALA_A');
      applyRoomStatus('ALA_A', checkin ? 'checkin' : mapStatus(alaA.today_status), alaA);
    }

    // ALA_B
    const alaB = roomsData['ALA_B'];
    if (alaB) {
      const checkin = checkinToday.has('ALA_B');
      applyRoomStatus('ALA_B', checkin ? 'checkin' : mapStatus(alaB.today_status), alaB);
    }

    // ALA_C_CASAL → applies to both ALA_C_1 and ALA_C_2
    const alaC = roomsData['ALA_C_CASAL'];
    if (alaC) {
      const checkin = checkinToday.has('ALA_C_1') || checkinToday.has('ALA_C_2');
      const status  = checkin ? 'checkin' : mapStatus(alaC.today_status);
      applyRoomStatus('ALA_C_1',    status, alaC);
      applyRoomStatus('ALA_C_2',    status, alaC);
    }

    // ALA_C_GRUPO
    const grupo = roomsData['ALA_C_GRUPO'];
    if (grupo) {
      applyRoomStatus('ALA_C_GRUPO', 'request', grupo);
    }
  }

  function mapStatus(apiStatus) {
    const map = { available: 'available', blocked: 'occupied', partial: 'partial', on_request: 'request', unknown: 'unknown' };
    return map[apiStatus] || 'unknown';
  }

  const STATUS_CLASSES = {
    available: { rect: 's-available', anim: 'anim-available', label: 'Disponivel',   badge: 'sb-available', color: '#22c55e' },
    occupied:  { rect: 's-occupied',  anim: 'anim-occupied',  label: 'Ocupado',      badge: 'sb-occupied',  color: '#ef4444' },
    checkin:   { rect: 's-checkin',   anim: 'anim-checkin',   label: 'Check-in hoje',badge: 'sb-checkin',   color: '#eab308' },
    partial:   { rect: 's-checkin',   anim: 'anim-checkin',   label: 'Parcial',      badge: 'sb-checkin',   color: '#eab308' },
    request:   { rect: 's-request',   anim: '',               label: 'Sob consulta', badge: 'sb-request',   color: '#6366f1' },
    unknown:   { rect: 's-unknown',   anim: '',               label: 'Sem dados',    badge: 'sb-unknown',   color: '#94a3b8' },
  };

  function applyRoomStatus(svgId, status, room) {
    const cfg  = STATUS_CLASSES[status] || STATUS_CLASSES.unknown;
    const rect = document.getElementById(`rect-${svgId}`);
    const grp  = document.getElementById(`room-${svgId}`);
    const txt  = document.getElementById(`status-text-${svgId}`);

    if (!rect || !grp) return;

    // Update rect class
    rect.className.baseVal = `room-area ${cfg.rect}`;

    // Update group animation class
    const baseClass = 'room-area';
    grp.className.baseVal = `${baseClass} ${cfg.anim}`;

    // Update status text
    if (txt) {
      txt.textContent = cfg.label;
      txt.setAttribute('fill', cfg.color);
    }
  }

  // ── Room detail panel ─────────────────────────────────────────────────────
  window.selectRoom = function(code) {
    selectedCode = code;
    const room = roomsData[code];
    const panel = document.getElementById('room-detail');

    if (!room) { panel.classList.remove('show'); return; }

    // Determine display status
    const statusKey = mapStatus(room.today_status);
    const cfg = STATUS_CLASSES[statusKey] || STATUS_CLASSES.unknown;
    const isGrupo = code === 'ALA_C_GRUPO';

    document.getElementById('detail-name').textContent = room.name;

    const badge = document.getElementById('detail-badge');
    badge.className = `status-badge ${cfg.badge}`;
    badge.textContent = cfg.label;

    const fmtBRL = v => new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 }).format(v || 0);

    document.getElementById('detail-grid').innerHTML = `
      <div>
        <div class="detail-stat-label">Hospedes max.</div>
        <div class="detail-stat-value">${isGrupo ? 'Variavel' : room.max_guests}</div>
      </div>
      ${!isGrupo ? `
      <div>
        <div class="detail-stat-label">Preco baixa</div>
        <div class="detail-stat-value">${fmtBRL(room.base_price_baixa)}<span style="font-size:.7rem;color:var(--tx3)">/noite</span></div>
      </div>
      <div>
        <div class="detail-stat-label">Preco media</div>
        <div class="detail-stat-value">${fmtBRL(room.base_price_media)}<span style="font-size:.7rem;color:var(--tx3)">/noite</span></div>
      </div>
      <div>
        <div class="detail-stat-label">Preco alta</div>
        <div class="detail-stat-value" style="color:var(--gold)">${fmtBRL(room.base_price_alta)}<span style="font-size:.7rem;color:var(--tx3)">/noite</span></div>
      </div>` : `
      <div>
        <div class="detail-stat-label">Cotacao</div>
        <div class="detail-stat-value" style="font-size:.875rem">R$ 150–210/px</div>
      </div>`}
      <div style="grid-column:1/-1">
        <div class="detail-stat-label">Descricao</div>
        <div style="font-size:.8125rem;color:var(--tx2);margin-top:2px;line-height:1.5">${escHtml(room.description)}</div>
      </div>
      ${room.amenities && room.amenities.length ? `
      <div style="grid-column:1/-1">
        <div class="detail-stat-label" style="margin-bottom:var(--sp-1)">Comodidades</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${room.amenities.map(a => `<span style="font-size:.7rem;padding:2px 7px;background:var(--sur1);border:1px solid var(--bdr0);border-radius:9999px;color:var(--tx2)">${escHtml(a)}</span>`).join('')}
        </div>
      </div>` : ''}
    `;

    panel.classList.add('show');
  };

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

})();
</script>
</body>
</html>
